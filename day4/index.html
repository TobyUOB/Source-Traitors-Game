<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 4 – The Poisoned Chalice</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
}

.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:1;
}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    position:relative;
    z-index:10;
}

h1 {
    font-size:2em;
    margin:10px 0;
    opacity:1;
    text-align:center;
    width:100%;
    transition:opacity 1.2s ease;
}

/* INTRO + SELECTION STACK */
#introContainer {
    position:relative;
    width:100%;
    min-height:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* INTRO CHALICE WRAPPER (moved down for spacing) */
#introChaliceWrapper {
    position:relative;
    display:inline-block;
    top:40px; /* moves chalice + poison down */
}

#chaliceIntro {
    width:200px;
    opacity:0;
    transition:opacity 2s ease;
    display:block;
}

/* Candle glow for first chalice */
#candleGlow {
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(255,190,90,0.35) 0%,
        rgba(255,160,60,0.18) 40%,
        transparent 70%);
    opacity:0;
    pointer-events:none;
}

@keyframes candleFlicker {
    0% {opacity:0.3;}
    30% {opacity:0.42;}
    60% {opacity:0.34;}
    100% {opacity:0.38;}
}

/* Poison bottle positioned relative to chalice with offset left */
#poison {
    position:absolute;
    width:140px;
    bottom:80%;       
    left:50%;         
    transform:translateX(-50%) rotate(0deg);
    margin-left:-40px; /* offset left for natural pour */
    opacity:0;
    transition:opacity 2s ease, transform 3.5s ease;
}

/* SELECTION */
#chalices {
    margin-top:40px;
    display:flex;
    gap:30px;
    opacity:0;
    pointer-events:none;
    transition:opacity 2s ease;
}

.choice {
    width:140px;
    cursor:pointer;
    transition:transform .6s ease, opacity .6s ease;
}

.choice.fade {
    opacity:0;
    transform:scale(0.8);
}

.choice.selected {
    transform:scale(1.2);
}

/* RESULT */
#result {
    margin-top:12px;
    font-size:1.8em;
    text-align:center;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    #chaliceIntro { width:160px; }
    #poison { width:110px; bottom:78%; margin-left:-35px; }
    .choice { width:110px; }
}
</style>
</head>

<body>
<div class="symbol-overlay"></div>

<div id="container">

    <img id="logo" src="images/logo.png">

    <h1 id="heading"></h1>

    <div id="introContainer">

        <!-- Intro chalice + poison inside same wrapper -->
        <div id="introChaliceWrapper">
            <div id="candleGlow"></div>
            <img src="images/chalice.png" id="chaliceIntro">
            <img src="images/poison.png" id="poison">
        </div>

        <!-- Selection -->
        <div id="chalices">
            <img src="images/chalice.png" class="choice" data-id="0">
            <img src="images/chalice.png" class="choice" data-id="1">
            <img src="images/chalice.png" class="choice" data-id="2">
        </div>

        <!-- Result inline with selection -->
        <div id="result"></div>
        <img id="qr" src="qr/day4prize.png">

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const heading = document.getElementById('heading');
const chaliceIntro = document.getElementById('chaliceIntro');
const poison = document.getElementById('poison');
const glow = document.getElementById('candleGlow');
const chalicesContainer = document.getElementById('chalices');
const choices = document.querySelectorAll('.choice');
const result = document.getElementById('result');
const qr = document.getElementById('qr');

let locked = true;
let poisonedIndex = Math.floor(Math.random() * 3);
let pulseIndex = 0;
let pulseTimer;

function typeText(text, cb) {
    let i = 0;
    heading.textContent = "";
    const t = setInterval(() => {
        heading.textContent += text[i++];
        if (i === text.length) {
            clearInterval(t);
            cb && cb();
        }
    }, 95);
}

/* INTRO */
typeText("Earlier today...", () => {

    setTimeout(() => {
        chaliceIntro.style.opacity = 1;
        glow.style.opacity = 1;
        glow.style.animation = "candleFlicker 1.3s infinite";
    }, 800);

    setTimeout(() => poison.style.opacity = 1, 3000);
    setTimeout(() => poison.style.transform = "translateX(-50%) rotate(65deg)", 5600);

    setTimeout(() => {
        poison.style.opacity = 0;
        chaliceIntro.style.opacity = 0;
        glow.style.opacity = 0;
    }, 8600);

    setTimeout(() => heading.style.opacity = 0, 9400);

    setTimeout(() => {
        glow.remove();
        heading.textContent = "Avoid the poisoned chalice";
        heading.style.opacity = 1;
        chalicesContainer.style.opacity = 1;
        chalicesContainer.style.pointerEvents = "auto";
        locked = false;
        startPulse();
    }, 10800);
});

/* Pulse loop for idle chalices */
function startPulse() {
    pulseTimer = setInterval(() => {
        choices.forEach(c => c.style.transform = "scale(1)");
        const c = choices[pulseIndex];
        c.style.transform = "scale(1.08) rotate(1deg)";
        pulseIndex = (pulseIndex + 1) % choices.length;
    }, 900);
}

/* Selection */
choices.forEach(choice => {
    choice.addEventListener('click', () => {
        if (locked) return;
        locked = true;
        clearInterval(pulseTimer);

        const id = Number(choice.dataset.id);

        choices.forEach(c => {
            if (c !== choice) c.classList.add('fade');
        });
        choice.classList.add('selected');

        setTimeout(() => {
            if (id === poisonedIndex) {
                result.textContent = "Oh no! You drank from the poisoned chalice!";
            } else {
                result.textContent = "You chose wisely.";
                qr.style.display = "block";
            }
        }, 500);
    });
});

});
</script>
</body>
</html>
