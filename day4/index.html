<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 4 – The Poison Chalice</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    font-family:'Cinzel', serif;
    color:white;
}

.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:1;
}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
}

#logo {
    width:100px;
    margin-bottom:10px;
}

h1 {
    font-size:2em;
    min-height:2em;
    text-align:center;
    margin-bottom:20px;
}

#introContainer {
    position:relative;
    height:260px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

#chaliceIntro {
    width:200px;
    opacity:0;
    transition:opacity 2s ease;
}

#poison {
    position:absolute;
    width:110px;
    top:-60px;
    left:50%;
    transform:translateX(-50%) rotate(0deg);
    opacity:0;
    transform-origin:top center;
    transition:opacity 3s ease, transform 4s ease;
}

#chalices {
    display:flex;
    gap:20px;
    opacity:0;
    transition:opacity 1.5s ease;
}

.chalice {
    width:140px;
    cursor:pointer;
    transition:all .6s ease;
}

.chalice.fade {
    opacity:0;
    transform:scale(.85);
}

.chalice.selected {
    animation:breath 1.4s infinite alternate;
}

@keyframes breath {
    from { transform:scale(1.15); }
    to { transform:scale(1.22); }
}

@keyframes pulse {
    0% { transform:scale(1) rotate(0deg); }
    50% { transform:scale(1.08) rotate(2deg); }
    100% { transform:scale(1) rotate(0deg); }
}

.pulsing {
    animation:pulse 1.4s ease-in-out infinite;
}

#message {
    margin-top:20px;
    font-size:1.6em;
    text-align:center;
}

#qr {
    margin-top:20px;
    width:200px;
    display:none;
}

@media(max-width:700px){
    .chalice { width:100px; }
    #chaliceIntro { width:150px; }
}
</style>
</head>

<body>
<div class="symbol-overlay"></div>

<div id="container">
    <img id="logo" src="images/logo.png">

    <h1 id="heading"></h1>

    <div id="introContainer">
        <img src="images/chalice.png" id="chaliceIntro">
        <img src="images/poison.png" id="poison">
    </div>

    <div id="chalices">
        <img src="images/chalice.png" class="chalice" data-id="0">
        <img src="images/chalice.png" class="chalice" data-id="1">
        <img src="images/chalice.png" class="chalice" data-id="2">
    </div>

    <div id="message"></div>
    <img id="qr" src="qr/day4prize.png">
</div>

<script src="script.js"></script>
</body>
</html>
