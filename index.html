<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* AMBIENT TORCHLIGHT */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}

body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}

@keyframes torchA { from{transform:translate(-4%,-3%);opacity:0.6;} to{transform:translate(4%,3%);opacity:1;} }
@keyframes torchB { from{transform:translate(3%,-3%);opacity:0.5;} to{transform:translate(-3%,4%);opacity:0.9;} }

/* CAMERA GRAIN */
body.grain::before {
    background-image: url('images/grain.png');
    background-size:cover;
    mix-blend-mode:overlay;
    opacity:0.05;
    animation: grainMove 12s linear infinite;
}

@keyframes grainMove {
    0% {transform:translate(0,0);} 25% {transform:translate(-2%,1%);}
    50% {transform:translate(1%,-1%);} 75% {transform:translate(-1%,2%);} 100% {transform:translate(0,0);}
}

/* SYMBOL OVERLAY */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}

@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* SMOKE & EMBERS */
#atmosphere { position: fixed; inset:0; pointer-events:none; z-index:1; }
.smoke {
    position:absolute;
    width:200px; height:200px;
    background:radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
    animation: smokeDrift 18s linear infinite, smokeSwirl 6s ease-in-out infinite alternate;
}
@keyframes smokeDrift { from{transform:translateY(100vh) scale(0.8);opacity:0;}20%{opacity:0.4;}100%{transform:translateY(-200px) scale(1.4);opacity:0;} }
@keyframes smokeSwirl { 0%{transform:translateX(0);}50%{transform:translateX(30px);}100%{transform:translateX(0);} }
.ember {
    position:absolute; width:4px; height:4px;
    background:orange; border-radius:50%; box-shadow:0 0 10px orange;
    animation: emberRise 6s linear infinite;
}
@keyframes emberRise { from{transform:translateY(100vh);opacity:0;}30%{opacity:1;}100%{transform:translateY(-50px) translateX(-40px);opacity:0;} }

/* CONTENT */
#container {
    position: relative;
    z-index: 2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
}
/* LOGO */
#logo { width:80%; max-width:320px; margin-bottom:8px; }
/* TEXT */
#landing-text {
    font-family:'Cinzel', serif;
    font-size:2.4em;
    font-weight:800;
    margin-bottom:8px;
    animation:flicker 1.2s infinite alternate;
    text-align:center;
}
@keyframes flicker { 0%{opacity:1;} 60%{opacity:0.45;} 100%{opacity:1;} }

/* SCROLL */
#scroll {
    width:90%; max-width:700px; height:380px;
    background-image:url("images/scroll.png");
    background-size:contain; background-repeat:no-repeat; background-position:center;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; overflow:hidden;
    animation:scrollGlowTilt 8s infinite alternate ease-in-out;
}
@keyframes scrollGlowTilt { 
    0% {filter:brightness(1); transform:rotate(-1.5deg);} 
    50%{filter:brightness(1.08); transform:rotate(1.5deg);} 
    100%{filter:brightness(0.98); transform:rotate(-1.5deg);}
}
/* SPOTLIGHT ON SCROLL */
#scroll::after {
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 45% 40%, rgba(255,220,150,0.25), transparent 60%);
    animation: scrollLight 4s infinite alternate ease-in-out;
    pointer-events:none;
}
@keyframes scrollLight {
    0% {transform:translate(-5%,-5%); opacity:0.6;}
    50%{transform:translate(5%,5%); opacity:0.8;}
    100%{transform:translate(-5%,-5%); opacity:0.6;}
}

/* SCROLL TEXT */
#scroll-text {
    font-family:'Cinzel', serif;
    font-size:2em;
    font-weight:800;
    color:#ff3b2f;
    text-shadow:0 0 6px rgba(255,60,40,0.9),0 0 16px rgba(255,120,80,0.8);
    position:relative; z-index:2;
    display:flex; flex-direction:column; justify-content:center; align-items:center; line-height:1.1em;
    animation:textGlow 3s infinite alternate ease-in-out;
}
#scroll-text span { display:block; }
@keyframes textGlow {
    0% { text-shadow:0 0 6px rgba(255,60,40,0.9),0 0 16px rgba(255,120,80,0.8); }
    50% { text-shadow:0 0 12px rgba(255,80,60,0.95),0 0 28px rgba(255,140,100,0.85); }
    100% { text-shadow:0 0 6px rgba(255,60,40,0.9),0 0 16px rgba(255,120,80,0.8); }
}
@media(max-width:500px) { #scroll-text { font-size:1.6em; } }

/* BOUNCE */
@keyframes bounceScroll {
    0%{transform:rotate(0deg) scale(1);}20%{transform:rotate(-5deg) scale(1.05);}
    40%{transform:rotate(3deg) scale(1.02);}60%{transform:rotate(-2deg) scale(1.03);}
    80%{transform:rotate(1deg) scale(1.01);}100%{transform:rotate(0deg) scale(1);}
}
#scroll.bounce { animation:bounceScroll 0.6s ease-in-out forwards; }

/* QR */
#qr{margin-top:20px;width:200px;display:none;}
</style>
</head>

<body class="grain">

<div class="symbol-overlay"></div>

<div id="atmosphere">
    <div class="smoke" style="left:10%; animation-delay:0s;"></div>
    <div class="smoke" style="left:50%; animation-delay:6s;"></div>
    <div class="smoke" style="left:80%; animation-delay:12s;"></div>

    <div class="ember" style="left:10%; animation-delay:0s;"></div>
    <div class="ember" style="left:15%; animation-delay:1s;"></div>
    <div class="ember" style="left:20%; animation-delay:2s;"></div>
    <div class="ember" style="left:30%; animation-delay:1s;"></div>
