<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traitors Game</title>
<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* Top text "Loyal or Imposter" */
#top-text {
    position: absolute;
    top: 40%; /* adjust as needed */
    width: 100%;
    text-align: center;
    font-size: 2.5em;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 5px #000;
    z-index: 5;
}

/* Flickering banner */
#banner {
    position: absolute;
    top: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
    font-size: 2em;
    font-weight: bold;
}

.flicker {
    margin: 0 20px;
    animation: flickerLight 1s infinite alternate;
}

@keyframes flickerLight {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

/* Role text */
#role {
    font-size: 4em;
    font-weight: bold;
    color: red;
    text-shadow: 0 0 5px #ff0000, 0 0 10px #ff4500, 0 0 20px #ff6347;
    display: none;
    margin-top: 20px;
    animation: flickerRole 1s infinite alternate;
}

@keyframes flickerRole {
    0% { text-shadow: 0 0 5px #ff0000,0 0 10px #ff4500,0 0 20px #ff6347; }
    50% { text-shadow: 0 0 10px #ff6347,0 0 20px #ff4500,0 0 30px #ff0000; }
    100% { text-shadow: 0 0 5px #ff0000,0 0 10px #ff4500,0 0 20px #ff6347; }
}

/* QR image */
#qr {
    width: 200px;
    margin-top: 20px;
    border: 2px solid white;
    border-radius: 10px;
    display: none;
}

/* Scroll overlay */
#scroll {
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    cursor: pointer;
    z-index: 10;
    user-select: none;
    background-color: rgba(0,0,0,0.4);
    background-image: url('images/scroll.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}

#scroll-text {
    color: #fff;
    background-color: rgba(0,0,0,0.6);
    padding: 0.3em 0.6em;
    border-radius: 5px;
    text-shadow: 0 0 3px #000;
    position: relative;
    z-index: 20;
}
</style>
</head>
<body>

<div id="top-text">Loyal or Imposter</div>

<div id="banner">
    <div class="flicker">Loyal</div>
    <div class="flicker">Imposter</div>
</div>

<div id="container">
    <div id="role"></div>
    <img id="qr">
    <div id="scroll"><span id="scroll-text">Tap to Reveal</span></div>
</div>

<script src="script.js"></script>
</body>
</html>
