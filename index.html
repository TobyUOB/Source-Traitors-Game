<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
}

/* ===== TORCHLIGHT ===== */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{opacity:0.6;} to{opacity:1;} }
@keyframes torchB { from{opacity:0.5;} to{opacity:0.9;} }

/* ===== GRAIN ===== */
body.grain::before {
    background-image: url('images/grain.png');
    background-size: cover;
    mix-blend-mode: overlay;
    opacity: 0.05;
}

/* ===== SYMBOLS ===== */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
}

/* ===== ATMOSPHERE ===== */
#atmosphere {
    position: fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.smoke {
    position:absolute;
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
    animation: smokeDrift linear infinite;
}
@keyframes smokeDrift {
    from{transform:translateY(100vh);opacity:0;}
    20%{opacity:0.35;}
    to{transform:translateY(-200px);opacity:0;}
}

.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation-name: emberRise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}
@keyframes emberRise {
    from { transform: translateY(100vh) translateX(0); opacity:0; }
    30%  { opacity:1; }
    to   { transform: translateY(-80px) translateX(var(--drift)); opacity:0; }
}

/* ===== CONTENT ===== */
#container {
    position: relative;
    z-index: 10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:16px;
    padding-bottom:28px;
}

/* ===== HEADER ===== */
#landing-text {
    font-family:'Cinzel', serif;
    font-size:2.4em;
    font-weight:800;
    margin-bottom:4px;
    line-height:0.95;
    animation:flicker 2.2s infinite alternate;
    text-align:center;
}
@keyframes flicker { 0%{opacity:1;} 60%{opacity:0.45;} 100%{opacity:1;} }

/* ===== LOGO ===== */
#logo {
    width:90%;
    max-width:340px;
    margin-bottom:4px;
}

/* ===== SCROLL ===== */
#scroll {
    width:90%;
    max-width:700px;
    aspect-ratio: 7 / 3.8;
    background:url("images/scroll.png") center/contain no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top:-60px;
}

/* ===== SCROLL BOUNCE ===== */
@keyframes bounceScroll {
    0%   { transform: rotate(0deg) scale(1); filter:brightness(1); }
    20%  { transform: rotate(-3deg) scale(1.06) translateY(-6px); filter:brightness(1.15); }
    40%  { transform: rotate(2deg) scale(1.03) translateY(-3px); }
    60%  { transform: rotate(-1deg) scale(1.04) translateY(-2px); }
    80%  { transform: rotate(1deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); filter:brightness(1); }
}
#scroll.bounce {
    animation: bounceScroll 0.6s ease-out forwards;
}

/* ===== SCROLL TEXT + BURN-IN ===== */
#scroll-text {
    font-family:'Cinzel', serif;
    font-size:2em;
    font-weight:800;
    color:#ff3b2f;
    text-align:center;
    line-height:1;
}

#scroll-text span {
    display:block;
    animation: burnIn 0.9s ease-out;
}

@keyframes burnIn {
    0% {
        opacity:0;
        filter:blur(8px);
        text-shadow:0 0 2px rgba(255,120,80,0.4);
    }
    40% {
        opacity:1;
        filter:blur(2px);
        text-shadow:0 0 18px rgba(255,120,80,1);
    }
    100% {
        filter:blur(0);
        text-shadow:0 0 10px rgba(255,90,60,0.9);
    }
}

/* ===== QR ===== */
#qr{
    margin-top:4px;
    max-width:80%;
    max-height:22vh;
    object-fit:contain;
    display:block;
}

/* ===== MOBILE ===== */
@media(max-width:500px){
    #logo { max-width:320px; }
    #scroll-text { font-size:1.6em; }
    #qr { max-width:70%; }
}
</style>
</head>

<body class="grain">

<div class="symbol-overlay"></div>

<div id="atmosphere">
    <div class="smoke" style="left:20%; animation-duration:22s;"></div>
    <div class="smoke" style="left:55%; animation-duration:26s;"></div>

    <script>
        for(let i=0;i<22;i++){
            const e=document.createElement('div');
            e.className='ember';
            e.style.left=Math.random()*100+'%';
            e.style.animationDuration=(4+Math.random()*4)+'s';
            e.style.animationDelay=Math.random()*6+'s';
            e.style.setProperty('--drift',((Math.random()-0.5)*60)+'px');
            document.getElementById('atmosphere').appendChild(e);
        }
    </script>
</div>

<div id="container">
    <div id="landing-text">Loyal or Imposter?</div>
    <img id="logo" src="images/logo.png" alt="Game Logo">

    <div id="scroll">
        <div id="scroll-text">
            <span>TAP</span>
            <span>TO REVEAL</span>
        </div>
    </div>

    <img id="qr">

    <audio id="fire-sound" loop>
        <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
    </audio>
</div>

<script src="script.js?v=1.8"></script>
</body>
</html>
