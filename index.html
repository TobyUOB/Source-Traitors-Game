<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loyal or Imposter</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* TORCH BACKGROUND */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{transform:translate(-4%,-3%);opacity:0.6;} to{transform:translate(4%,3%);opacity:1;} }
@keyframes torchB { from{transform:translate(3%,-3%);opacity:0.5;} to{transform:translate(-3%,4%);opacity:0.9;} }

/* SYMBOLS */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
}

/* CONTAINER */
#container {
    position: relative;
    z-index: 10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
}

/* TITLE */
#landing-text {
    font-family:'Cinzel', serif;
    font-size:2.3em;
    font-weight:800;
    margin-bottom:10px;
    animation:flicker 1.2s infinite alternate;
}
@keyframes flicker { 0%{opacity:1;} 60%{opacity:0.45;} 100%{opacity:1;} }

/* SCROLL ROW */
#scroll-row {
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 24px;
    width:100%;
    max-width:1200px;
    height: 380px;
}

/* SIDE LOGOS */
.side-logo {
    height: 75%;
    max-height: 360px;
    width: auto;
    filter: drop-shadow(0 0 18px rgba(255,140,60,0.85));
    animation: logoFlicker 4s infinite alternate ease-in-out;
    z-index:11;
}
.side-logo.left { transform:rotate(-3deg); }
.side-logo.right { transform:rotate(3deg); }

@keyframes logoFlicker {
    0% { opacity:0.75; }
    50% { opacity:1; }
    100% { opacity:0.85; }
}

/* SCROLL */
#scroll {
    width:90%;
    max-width:700px;
    height:380px;
    background:url("images/scroll.png") no-repeat center / contain;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    animation:scrollGlowTilt 8s infinite alternate ease-in-out;
    z-index:11;
}
@keyframes scrollGlowTilt {
    0%{filter:brightness(1);transform:rotate(-1.5deg);}
    50%{filter:brightness(1.08);transform:rotate(1.5deg);}
    100%{filter:brightness(0.98);transform:rotate(-1.5deg);}
}

/* SCROLL TEXT */
#scroll-text {
    font-family:'Cinzel', serif;
    font-size:2em;
    font-weight:800;
    color:#ff3b2f;
    text-shadow:0 0 10px rgba(255,80,60,0.9),0 0 26px rgba(255,140,100,0.8);
    text-align:center;
    animation:textGlow 3s infinite alternate;
}
#scroll-text span { display:block; }
@keyframes textGlow {
    from { text-shadow:0 0 8px rgba(255,60,40,0.8); }
    to   { text-shadow:0 0 22px rgba(255,150,100,0.95); }
}

/* QR */
#qr {
    margin-top:20px;
    width:200px;
    display:none;
    z-index:11;
}

/* 🔥 FOREGROUND EMBERS (IN FRONT OF LOGOS & SCROLL) */
#foreground-embers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}
.ember-front {
    position:absolute;
    width:5px;
    height:5px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 14px rgba(255,150,60,0.9);
    animation: emberFloat 6s linear infinite;
}
@keyframes emberFloat {
    from { transform:translateY(110vh) translateX(0); opacity:0; }
    20%  { opacity:1; }
    to   { transform:translateY(-20vh) translateX(-40px); opacity:0; }
}

/* MOBILE */
@media(max-width:600px){
    .side-logo {
        height: 45%;
        max-height: 180px;
    }
}
</style>
</head>

<body>

<div class="symbol-overlay"></div>

<!-- FOREGROUND EMBERS -->
<div id="foreground-embers">
    <div class="ember-front" style="left:10%;animation-delay:0s;"></div>
    <div class="ember-front" style="left:20%;animation-delay:1s;"></div>
    <div class="ember-front" style="left:30%;animation-delay:2s;"></div>
    <div class="ember-front" style="left:40%;animation-delay:1.5s;"></div>
    <div class="ember-front" style="left:50%;animation-delay:0.5s;"></div>
    <div class="ember-front" style="left:60%;animation-delay:2.5s;"></div>
    <div class="ember-front" style="left:70%;animation-delay:1s;"></div>
    <div class="ember-front" style="left:80%;animation-delay:3s;"></div>
</div>

<div id="container">
    <div id="landing-text">Loyal or Imposter</div>

    <div id="scroll-row">
        <img class="side-logo left" src="images/logo.png" alt="Logo">
        <div id="scroll">
            <div id="scroll-text">
                <span>TAP</span>
                <span>TO REVEAL</span>
            </div>
        </div>
        <img class="side-logo right" src="images/logo.png" alt="Logo">
    </div>

    <img id="qr" />
</div>

<audio id="fire-sound" loop>
    <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
