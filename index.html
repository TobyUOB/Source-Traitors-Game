<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ---------------- BASE ---------------- */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* ---------------- TORCHLIGHT BACKGROUND ---------------- */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    background: radial-gradient(
        circle at 30% 40%,
        rgba(255,190,110,0.30),
        transparent 55%
    );
    animation: torchA 5.5s infinite alternate ease-in-out;
}

body::after {
    background: radial-gradient(
        circle at 70% 65%,
        rgba(255,150,70,0.26),
        transparent 60%
    );
    animation: torchB 7s infinite alternate ease-in-out;
}

@keyframes torchA {
    from { transform: translate(-4%, -3%); opacity: 0.6; }
    to   { transform: translate(4%, 3%);  opacity: 1; }
}

@keyframes torchB {
    from { transform: translate(3%, -3%); opacity: 0.5; }
    to   { transform: translate(-3%, 4%); opacity: 0.9; }
}

/* ---------------- SMOKE & EMBERS ---------------- */
#atmosphere {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

.smoke {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(
        circle,
        rgba(200,200,200,0.08),
        transparent 70%
    );
    animation: smokeDrift 18s linear infinite;
}

@keyframes smokeDrift {
    from {
        transform: translateY(100vh) translateX(0) scale(0.8);
        opacity: 0;
    }
    20% { opacity: 0.4; }
    100% {
        transform: translateY(-200px) translateX(120px) scale(1.4);
        opacity: 0;
    }
}

.ember {
    position: absolute;
    width: 4px;
    height: 4px;
    background: orange;
    border-radius: 50%;
    box-shadow: 0 0 10px orange;
    animation: emberRise 6s linear infinite;
}

@keyframes emberRise {
    from {
        transform: translateY(100vh);
        opacity: 0;
    }
    30% { opacity: 1; }
    100% {
        transform: translateY(-50px) translateX(-40px);
        opacity: 0;
    }
}

/* ---------------- CONTENT ---------------- */
#container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

/* Logo */
#logo {
    width: 80%;
    max-width: 320px;
    margin-bottom: 8px;
}

/* Landing text */
#landing-text {
    font-family: 'Cinzel', serif;
    font-size: 2.4em;
    font-weight: 800;
    margin-bottom: 12px;
    animation: flicker 1.2s infinite alternate;
    text-align: center;
}

@keyframes flicker {
    0% { opacity: 1; }
    60% { opacity: 0.45; }
    100% { opacity: 1; }
}

/* ---------------- SCROLL ---------------- */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background-image: url("images/scroll.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;

    /* Animated parchment shadows */
    box-shadow:
        inset 0 0 25px rgba(0,0,0,0.45),
        inset 0 0 60px rgba(120,60,20,0.35);
    animation: parchmentShadow 6s infinite alternate;
}

@keyframes parchmentShadow {
    from {
        box-shadow:
            inset 0 0 20px rgba(0,0,0,0.35),
            inset 0 0 50px rgba(120,60,20,0.25);
    }
    to {
        box-shadow:
            inset 0 0 35px rgba(0,0,0,0.55),
            inset 0 0 80px rgba(180,90,40,0.45);
    }
}

/* Scroll text */
#scroll-text {
    font-family: 'Cinzel', serif;
    font-size: 3em;
    font-weight: 800;
    color: #ff3b2f;
    text-shadow:
        0 0 6px rgba(255,60,40,0.9),
        0 0 16px rgba(255,120,80,0.8);
    position: relative;
    z-index: 3;
    pointer-events: none;
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}
</style>
</head>

<body>

<!-- Smoke & embers -->
<div id="atmosphere">
    <div class="smoke" style="left:10%; animation-delay:0s;"></div>
    <div class="smoke" style="left:50%; animation-delay:6s;"></div>
    <div class="smoke" style="left:80%; animation-delay:12s;"></div>

    <div class="ember" style="left:30%; animation-delay:1s;"></div>
    <div class="ember" style="left:60%; animation-delay:3s;"></div>
    <div class="ember" style="left:75%; animation-delay:5s;"></div>
</div>

<div id="container">

    <img id="logo" src="images/logo.png" alt="Game Logo">

    <div id="landing-text">Loyal or Imposter</div>

    <div id="scroll">
        <div id="scroll-text">Tap to Reveal</div>
    </div>

    <img id="qr" />

</div>

<script src="script.js?v=7.0"></script>
</body>
</html>
