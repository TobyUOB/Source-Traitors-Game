<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traitors Game</title>

<style>
body {
    margin: 0;
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

#container {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Flickering landing text */
#landing-text {
    font-size: 2.5em;
    font-weight: bold;
    margin-bottom: 20px;
    animation: flicker 1s infinite alternate;
}

@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* Scroll */
#scroll {
    width: 80%;
    max-width: 500px;
    height: 300px;
    background-image: url("images/scroll.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

#scroll-text {
    font-size: 2em;
    font-weight: bold;
    color: white;
    background: rgba(0,0,0,0.6);
    padding: 10px 20px;
    border-radius: 8px;
    text-shadow: 0 0 5px black;
}

/* Role reveal */
#role {
    margin-top: 20px;
    font-size: 3em;
    color: red;
    text-shadow: 0 0 10px red;
    display: none;
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}
</style>
</head>

<body>

<div id="container">

    <!-- LANDING TEXT -->
    <div id="landing-text">Loyal or Imposter</div>

    <!-- SCROLL -->
    <div id="scroll">
        <div id="scroll-text">Tap to Reveal</div>
    </div>

    <!-- ROLE & QR -->
    <div id="role"></div>
    <img id="qr" />

</div>

<script src="script.js"></script>
</body>
</html>
