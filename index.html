<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyal or Imposter</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
}

/* TORCH BACKGROUND */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{transform:translate(-4%,-3%);opacity:0.6;} to{transform:translate(4%,3%);opacity:1;} }
@keyframes torchB { from{transform:translate(3%,-3%);opacity:0.5;} to{transform:translate(-3%,4%);opacity:0.9;} }

/* SYMBOL OVERLAY */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
}

/* MAIN */
#container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 18px;
}

/* TITLE */
#landing-text {
    font-family: 'Cinzel', serif;
    font-size: 2.3em;
    font-weight: 800;
    margin-bottom: 6px;
    animation: flicker 1.2s infinite alternate;
    text-align: center;
}
@keyframes flicker {
    0% { opacity: 1; }
    60% { opacity: 0.45; }
    100% { opacity: 1; }
}

/* LOGO */
#logo-wrapper {
    position: relative;
    margin: 6px 0 10px;
}

#logo {
    width: 200px;
    max-width: 60vw;
    filter:
        drop-shadow(0 1px 1px rgba(255,200,160,0.25))
        drop-shadow(0 6px 18px rgba(255,120,60,0.75))
        drop-shadow(0 0 30px rgba(255,180,100,0.35));
    animation: logoBreath 5s infinite alternate ease-in-out;
}

@keyframes logoBreath {
    from { filter:
        drop-shadow(0 2px 4px rgba(255,200,160,0.25))
        drop-shadow(0 10px 22px rgba(255,120,60,0.7)); }
    to { filter:
        drop-shadow(0 4px 8px rgba(255,220,180,0.35))
        drop-shadow(0 16px 32px rgba(255,180,100,0.95)); }
}

/* EMBERS FROM LOGO */
.logo-embers {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 12;
}
.logo-ember {
    position: absolute;
    width: 4px;
    height: 4px;
    background: orange;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255,150,60,0.9);
    animation: emberTrail 5s linear infinite;
}
@keyframes emberTrail {
    from { transform: translateY(0) translateX(0); opacity: 1; }
    to   { transform: translateY(-120px) translateX(-40px); opacity: 0; }
}

/* SCROLL */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background: url("images/scroll.png") no-repeat center / contain;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    animation: scrollGlow 8s infinite alternate ease-in-out;
}
@keyframes scrollGlow {
    0% { filter: brightness(1); }
    50% { filter: brightness(1.08); }
    100% { filter: brightness(0.98); }
}

/* SCROLL TEXT */
#scroll-text {
    font-family: 'Cinzel', serif;
    font-size: 2em;
    font-weight: 800;
    color: #ff3b2f;
    text-shadow: 0 0 10px rgba(255,80,60,0.9), 0 0 28px rgba(255,140,100,0.8);
    text-align: center;
    animation: textGlow 3s infinite alternate;
}
#scroll-text span { display: block; }

@keyframes textGlow {
    from { text-shadow: 0 0 10px rgba(255,60,40,0.8); }
    to   { text-shadow: 0 0 28px rgba(255,150,100,0.95); }
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}

/* MOBILE */
@media(max-width:500px){
    #logo { width: 160px; }
    #scroll-text { font-size: 1.6em; }
}
</style>
</head>

<body>

<div class="symbol-overlay"></div>

<div id="container">
    <div id="landing-text">Loyal or Imposter</div>

    <div id="logo-wrapper">
        <img id="logo" src="images/logo.png" alt="Logo">
        <div class="logo-embers">
            <div class="logo-ember" style="left:20%;animation-delay:0s"></div>
            <div class="logo-ember" style="left:40%;animation-delay:1s"></div>
            <div class="logo-ember" style="left:60%;animation-delay:2s"></div>
            <div class="logo-ember" style="left:80%;animation-delay:1.5s"></div>
        </div>
    </div>

    <div id="scroll">
        <div id="scroll-text">
            <span>TAP</span>
            <span>TO REVEAL</span>
        </div>
    </div>

    <img id="qr">
</div>

<audio id="fire-sound" loop>
    <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
