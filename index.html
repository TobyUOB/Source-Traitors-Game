<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Landing text */
#landing-text {
    font-size: 2.6em;
    font-weight: bold;
    margin-bottom: 10px;
    animation: flicker 1s infinite alternate;
}

@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* Scroll */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background-image: url("images/scroll.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.8s ease-out;
}

/* Scroll unroll animation */
#scroll.open {
    transform: scaleX(1);
}

/* Scroll text */
#scroll-text {
    font-size: 3em;
    font-weight: bold;
    color: red;
    padding: 10px 20px;
    background: rgba(0,0,0,0.6);
    border-radius: 8px;
    text-shadow: 0 0 10px red;
    position: relative;
    overflow: hidden;
}

/* Torch light sweep */
#scroll-text::after {
    content: "";
    position: absolute;
    top: 0;
    left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.6),
        transparent
    );
    animation: none;
}

#scroll.revealed #scroll-text::after {
    animation: torch 1.2s infinite;
}

@keyframes torch {
    0% { left: -50%; }
    100% { left: 120%; }
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}
</style>
</head>

<body>

<div id="container">
    <div id="landing-text">Loyal or Imposter</div>

    <div id="scroll">
        <div id="scroll-text">Tap to Reveal</div>
    </div>

    <img id="qr" />
</div>

<script src="script.js?v=2.0"></script>
</body>
</html>
