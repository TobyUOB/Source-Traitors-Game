<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<!-- Ancient-style font -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Landing text */
#landing-text {
    font-family: 'Cinzel', serif;
    font-size: 2.6em;
    font-weight: 800;
    margin-bottom: 12px;
    animation: flicker 1s infinite alternate;
}

@keyframes flicker {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* Scroll */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background-image: url("images/scroll.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;

    /* UNROLL SETUP */
    transform: scaleY(0.15);
    transform-origin: top;
    opacity: 0.8;
    transition: transform 0.9s ease-out, opacity 0.9s ease-out;
}

/* Unrolled state */
#scroll.open {
    transform: scaleY(1);
    opacity: 1;
}

/* Scroll text */
#scroll-text {
    font-family: 'Cinzel', serif;
    font-size: 3.2em;
    font-weight: 800;
    color: #ff2a2a;
    text-shadow:
        0 0 6px #ff2a2a,
        0 0 14px rgba(255,60,60,0.8),
        0 0 30px rgba(255,80,80,0.6);
    position: relative;
    overflow: hidden;
    pointer-events: none;
}

/* Torch light sweep */
#scroll-text::after {
    content: "";
    position: absolute;
    top: -20%;
    left: -60%;
    width: 60%;
    height: 140%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.7),
        transparent
    );
    animation: none;
}

#scroll.revealed #scroll-text::after {
    animation: torch 1.4s infinite;
}

@keyframes torch {
    0% { left: -60%; }
    100% { left: 140%; }
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}
</style>
</head>

<body>

<div id="container">

    <div id="landing-text">Loyal or Imposter</div>

    <div id="scroll">
        <div id="scroll-text">Tap to Reveal</div>
    </div>

    <img id="qr" />

</div>

<script src="script.js?v=3.0"></script>
</body>
</html>
