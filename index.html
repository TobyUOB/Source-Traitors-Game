<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loyal or Imposter</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* BASE */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* TORCH BACKGROUND */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{transform:translate(-4%,-3%);} to{transform:translate(4%,3%);} }
@keyframes torchB { from{transform:translate(3%,-3%);} to{transform:translate(-3%,4%);} }

/* SYMBOLS */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
}

/* MAIN */
#container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 18px;
    position: relative;
}

/* TITLE */
#landing-text {
    font-family: 'Cinzel', serif;
    font-size: 2.3em;
    font-weight: 800;
    animation: flicker 1.2s infinite alternate;
}
@keyframes flicker {
    0% { opacity: 1; }
    60% { opacity: 0.45; }
    100% { opacity: 1; }
}

/* LOGO */
#logo {
    width: 200px;
    max-width: 60vw;
    margin: 8px 0 12px;
    filter:
        drop-shadow(0 2px 4px rgba(255,200,160,0.25))
        drop-shadow(0 12px 30px rgba(255,120,60,0.75));
    animation: logoBreath 5s infinite alternate ease-in-out;
}
@keyframes logoBreath {
    from { filter: drop-shadow(0 6px 18px rgba(255,120,60,0.7)); }
    to   { filter: drop-shadow(0 16px 36px rgba(255,180,100,0.95)); }
}

/* SCROLL */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background: url("images/scroll.png") no-repeat center / contain;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* SCROLL TEXT */
#scroll-text {
    font-family: 'Cinzel', serif;
    font-size: 2em;
    font-weight: 800;
    color: #ff3b2f;
    text-align: center;
    opacity: 1;
}

/* 🔥 CINEMATIC BURN-IN */
.burn-in {
    animation: burnReveal 1.6s ease-out forwards;
}

@keyframes burnReveal {
    0% {
        opacity: 0;
        clip-path: inset(0 50% 0 50%);
        filter: blur(6px);
        text-shadow: 0 0 0 rgba(255,80,40,0);
    }
    30% {
        opacity: 1;
        clip-path: inset(0 20% 0 20%);
        filter: blur(3px);
        text-shadow: 0 0 18px rgba(255,120,60,0.9);
    }
    70% {
        clip-path: inset(0 0 0 0);
        filter: blur(0);
        text-shadow:
            0 0 22px rgba(255,140,90,0.95),
            0 0 40px rgba(255,80,40,0.6);
    }
    100% {
        text-shadow:
            0 0 10px rgba(255,90,60,0.8),
            0 0 20px rgba(255,120,80,0.6);
    }
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}

/* MOBILE */
@media(max-width:500px){
    #logo { width: 160px; }
    #scroll-text { font-size: 1.6em; }
}
</style>
</head>

<body>

<div class="symbol-overlay"></div>

<div id="container">
    <div id="landing-text">Loyal or Imposter</div>
    <img id="logo" src="images/logo.png" alt="Logo">

    <div id="scroll">
        <div id="scroll-text">
            <span>TAP</span>
            <span>TO REVEAL</span>
        </div>
    </div>

    <img id="qr">
</div>

<audio id="fire-sound" loop>
    <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
