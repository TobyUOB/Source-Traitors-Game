<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #0c0a07;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* 🔥 Ambient torch flicker background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,180,90,0.12), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(255,140,60,0.10), transparent 60%);
    animation: ambientFlicker 6s infinite alternate;
    pointer-events: none;
    z-index: 0;
}

@keyframes ambientFlicker {
    0% {
        opacity: 0.7;
        filter: blur(0px);
    }
    100% {
        opacity: 1;
        filter: blur(1px);
    }
}

#container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

/* Logo */
#logo {
    width: 80%;
    max-width: 320px;
    margin-bottom: 8px;
}

/* Landing text */
#landing-text {
    font-family: 'Cinzel', serif;
    font-size: 2.4em;
    font-weight: 800;
    margin-bottom: 12px;
    animation: flicker 1.2s infinite alternate;
    text-align: center;
}

@keyframes flicker {
    0% { opacity: 1; }
    60% { opacity: 0.45; }
    100% { opacity: 1; }
}

/* Scroll */
#scroll {
    width: 90%;
    max-width: 700px;
    height: 380px;
    background-image: url("images/scroll.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

/* 🔦 Torch light on scroll (natural, soft) */
#scroll::after {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(
        circle at 30% 50%,
        rgba(255,200,120,0.35),
        rgba(255,150,80,0.15),
        transparent 60%
    );
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
}

#scroll.revealed::after {
    opacity: 1;
    animation: scrollTorch 4.5s infinite alternate ease-in-out;
}

@keyframes scrollTorch {
    0% {
        transform: translateX(-10%) translateY(-5%);
        opacity: 0.6;
    }
    100% {
        transform: translateX(10%) translateY(5%);
        opacity: 0.9;
    }
}

/* Scroll text */
#scroll-text {
    font-family: 'Cinzel', serif;
    font-size: 3em;
    font-weight: 800;
    color: #ff3b2f;
    text-shadow:
        0 0 6px rgba(255,60,40,0.8),
        0 0 14px rgba(255,120,80,0.6);
    position: relative;
    z-index: 2;
    pointer-events: none;
}

/* QR */
#qr {
    margin-top: 20px;
    width: 200px;
    display: none;
}
</style>
</head>

<body>

<div id="container">

    <img id="logo" src="images/logo.png" alt="Game Logo">

    <div id="landing-text">Loyal or Imposter</div>

    <div id="scroll">
        <div id="scroll-text">Tap to Reveal</div>
    </div>

    <img id="qr" />

</div>

<script src="script.js?v=5.0"></script>
</body>
</html>
