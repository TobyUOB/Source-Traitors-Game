<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traitors Game</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ===== BASE ===== */
body {
    margin: 0;
    background: #0a0805;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
}

/* ===== TORCHLIGHT ===== */
body::before,
body::after {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{opacity:0.6;} to{opacity:1;} }
@keyframes torchB { from{opacity:0.5;} to{opacity:0.9;} }

/* ===== SYMBOLS ===== */
.symbol-overlay {
    position: fixed;
    inset: 0;
    background: url('images/symbols.png') repeat;
    background-size: 180px 180px;
    opacity: 0.1;
    pointer-events: none;
    z-index: 1;
}

/* ===== ATMOSPHERE ===== */
#atmosphere {
    position: fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.smoke {
    position:absolute;
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
    animation: smokeDrift linear infinite;
}
@keyframes smokeDrift {
    from{transform:translateY(100vh);opacity:0;}
    20%{opacity:0.35;}
    to{transform:translateY(-200px);opacity:0;}
}

.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation-name: emberRise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}
@keyframes emberRise {
    from { transform: translateY(100vh) translateX(0); opacity:0; }
    30%  { opacity:1; }
    to   { transform: translateY(-80px) translateX(var(--drift)); opacity:0; }
}

/* ===== CONTENT ===== */
#container {
    position: relative;
    z-index: 10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:16px;
    padding-bottom:28px;
}

/* ===== HEADER ===== */
#landing-text {
    font-family:'Cinzel', serif;
    font-size:2.4em;
    font-weight:800;
    margin-bottom:4px;
    line-height:0.95;
    animation:flicker 2.2s infinite alternate;
    text-align:center;
}
@keyframes flicker { 0%{opacity:1;} 60%{opacity:0.45;} 100%{opacity:1;} }

/* ===== LOGO ===== */
#logo {
    width:90%;
    max-width:100px;
    margin-bottom:0px;
}

/* ===== SCROLL ===== */
#scroll {
    width:90%;
    max-width:700px;
    aspect-ratio: 7 / 3.8;
    background:url("images/scroll.png") center/contain no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-top:4px;
    animation: scrollIdle 9s ease-in-out infinite;
}

/* ===== SCROLL BOUNCE ===== */
@keyframes bounceScroll {
    0%   { transform: rotate(0deg) scale(1); filter:brightness(1); }
    20%  { transform: rotate(-3deg) scale(1.06) translateY(-6px); filter:brightness(1.15); }
    40%  { transform: rotate(2deg) scale(1.03) translateY(-3px); }
    60%  { transform: rotate(-1deg) scale(1.04) translateY(-2px); }
    80%  { transform: rotate(1deg) scale(1.02); }
    100% { transform: rotate(0deg) scale(1); filter:brightness(1); }
}
#scroll.bounce {
    animation: bounceScroll 0.6s ease-out forwards;
}

/* ===== SCROLL IDLE ===== */
@keyframes scrollIdle {
    0%   { transform: rotate(-1.2deg); }
    50%  { transform: rotate(1.2deg); }
    100% { transform: rotate(-1.2deg); }
}

/* ===== SCROLL TEXT ===== */
#scroll-text {
    font-family:'Cinzel', serif;
    font-size:2em;
    font-weight:800;
    color:#ff3b2f;
    text-align:center;
    line-height:1;
}
#scroll-text span {
    display:block;
    animation: burnIn 0.9s ease-out;
}
@keyframes burnIn {
    0% { opacity:0; filter:blur(8px); }
    100% { opacity:1; filter:blur(0); }
}

/* ===== RESULT MESSAGE ===== */
#result-message {
    margin-top: 8px;
    margin-bottom: 6px;
    font-family: 'Cinzel', serif;
    font-size: 1.2em;
    text-align: center;
    color: #ffcf8a;
    max-width: 90%;
}

/* ===== QR ===== */
#qr {
    margin-top: 4px;
    width: 90%;
    max-width: 300px;
    height: auto;
    display: none;
}

/* ===== MOBILE ===== */
@media(max-width:500px){
    #scroll-text { font-size:1.6em; }
}
</style>
</head>

<body>

<div class="symbol-overlay"></div>

<div id="atmosphere">
    <div class="smoke" style="left:20%; animation-duration:22s;"></div>
    <div class="smoke" style="left:55%; animation-duration:26s;"></div>
</div>

<div id="container">
    <div id="landing-text">Loyal or Imposter?</div>
    <img id="logo" src="images/logo.png" alt="Game Logo">

    <div id="scroll">
        <div id="scroll-text">
            <span>TAP</span>
            <span>TO REVEAL</span>
        </div>
    </div>

    <div id="result-message"></div>
    <img id="qr">

    <audio id="fire-sound" loop>
        <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
    </audio>
</div>

<script src="script.js"></script>
</body>
</html>
