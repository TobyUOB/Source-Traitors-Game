<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
.flicker { animation:flicker 1.2s infinite alternate; }

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    position:relative;
    z-index:10;
}

h1 {
    font-size:2em;
    margin:10px 0;
    text-align:center;
    width:100%;
}

/* EMBERS */
#embers { position:fixed; inset:0; pointer-events:none; z-index:1; }
.ember {
    position:absolute; width:4px; height:4px; background:orange;
    border-radius:50%; box-shadow:0 0 10px orange;
    animation:emberRise 6s linear infinite;
}
@keyframes emberRise {
    from {transform:translateY(100vh); opacity:0;}
    30% {opacity:1;}
    to {transform:translateY(-50px) translateX(-40px); opacity:0;}
}

/* PATHS WRAPPER */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:60px;
    justify-content:center;
    height:250px;
}

/* PATHS + GLOW */
.path-wrapper { position:relative; display:inline-block; }
.path-glow {
    position:absolute;
    inset:-15px;
    background: radial-gradient(circle, rgba(0,0,0,0.35) 0%, transparent 70%);
    border-radius:15px;
    z-index:1;
    pointer-events:none;
    animation: glowFlicker 1.5s infinite alternate;
}
@keyframes glowFlicker { 0% {opacity:0.2;} 50%{opacity:0.35;} 100%{opacity:0.2;} }

#flare {
    position:absolute; width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,80,0.25) 0%, transparent 70%);
    top:50%; left:0; transform:translate(-50%, -50%);
    pointer-events:none; opacity:0;
}

.path {
    width:200px;
    cursor:pointer;
    position:absolute; /* absolute to allow smooth drift */
    transition: transform 1s ease, opacity 1s ease, left 2s ease;
    z-index:5;
}
.path.fade { opacity:0; }

@keyframes pulse {0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.path.pulse { animation:pulse 2s infinite ease-in-out; }

/* RESULT IMAGE + TEXT + QR */
#resultText {
    font-size:1.8em;
    margin-top:12px;
    text-align:center;
}
#resultImg { width:220px; opacity:0; transform:scale(1.5); transition: opacity 1.5s ease, transform 1.5s ease; }
#qr { width:200px; margin-top:6px; display:none; }

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #flare { width:160px; height:160px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>
<div id="embers"></div>

<div id="container">
    <img id="logo" src="images/logo.png">
    <h1 class="flicker">Choose your path</h1>

    <div id="pathsWrapper">
        <div class="path-wrapper"><div class="path-glow"></div><img src="images/path1.png" class="path" data-id="0"></div>
        <div class="path-wrapper"><div class="path-glow"></div><img src="images/path2.png" class="path" data-id="1"></div>
        <div id="flare"></div>
    </div>

    <div id="resultContainer">
        <div id="resultText"></div>
        <img id="resultImg" src="">
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const paths = document.querySelectorAll('.path');
const resultText = document.getElementById('resultText');
const resultImg = document.getElementById('resultImg');
const qr = document.getElementById('qr');
const flare = document.getElementById('flare');
const emberContainer = document.getElementById('embers');

let locked=false;
const winningIndex=Math.floor(Math.random()*2);

// Ambient embers
for(let i=0;i<20;i++){
    const e=document.createElement('div');
    e.className='ember';
    e.style.left=Math.random()*100+'%';
    e.style.animationDelay=Math.random()*6+'s';
    emberContainer.appendChild(e);
}

// Place paths at initial positions (absolute)
paths.forEach(p=>{
    const rect=p.getBoundingClientRect();
    const wrapperRect=p.parentElement.getBoundingClientRect();
    p.style.left = (rect.left - wrapperRect.left) + 'px';
    p.style.top = (rect.top - wrapperRect.top) + 'px';
});

// Flare animation
let flareIndex=0;
let flareTimer=setInterval(()=>{
    paths.forEach(p=>p.style.zIndex=5);
    const p = paths[flareIndex];
    const rect = p.getBoundingClientRect();
    flare.style.left = rect.left + rect.width/2 + 'px';
    flare.style.top = rect.top + rect.height/2 + 'px';
    flare.style.opacity=0.25;
    setTimeout(()=>flare.style.opacity=0,500);
    flareIndex=(flareIndex+1)%paths.length;
},900);

paths.forEach(path=>{
    path.addEventListener('click',()=>{
        if(locked) return;
        locked=true;
        clearInterval(flareTimer);

        const id=Number(path.dataset.id);
        const selected=path;
        const nonSelected=[...paths].filter(p=>p!==selected)[0];

        // Fade out non-selected path
        nonSelected.style.transition="opacity 2s ease";
        nonSelected.style.opacity=0;

        // After fade out, drift selected to page center
        setTimeout(()=>{
            selected.classList.add('pulse');
            const pageWidth=window.innerWidth;
            const rect=selected.getBoundingClientRect();
            const delta = (pageWidth/2 - rect.width/2) - rect.left;
            selected.style.transition="left 2.5s ease";
            selected.style.left = (parseFloat(selected.style.left) + delta) + 'px';
        },2000);

        // After drift, big zoom enter (~2s)
        setTimeout(()=>{
            selected.style.transition="transform 2s ease, opacity 2s ease";
            selected.style.transform="scale(3)";
            selected.style.opacity=0;
        },4500);

        // After fade, show result in same position as path
        setTimeout(()=>{
            const rect=selected.getBoundingClientRect();
            resultImg.style.position='absolute';
            resultImg.style.left=rect.left + 'px';
            resultImg.style.top=rect.top + 'px';
            resultImg.style.opacity=1;
            resultImg.style.transform='scale(3)';

            if(id===winningIndex){
                resultImg.src='images/castle.png';
                resultText.textContent="You reached the magical castle!";
                qr.style.display="block";
            }else{
                resultImg.src='images/mansion.png';
                resultText.textContent="Oh no! You ended up in the haunted mansion!";
            }

            setTimeout(()=>{
                resultImg.style.transition="transform 1.5s ease";
                resultImg.style.transform="scale(1)";
            },50);
        },6500);

    });
});

});
</script>
</body>
</html>
