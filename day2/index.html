<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.5;}}
.flicker {animation:flicker 1.2s infinite alternate;}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo { width:100px; margin-bottom:14px; z-index:10; position:relative; }

#introText {
    font-size:1.8em;
    margin:10px 20px;
    text-align:center;
    opacity:1;
    overflow:hidden;
    white-space:nowrap;
    border-right:2px solid white;
    width:0;
}

h1#chooseText {
    font-size:2em;
    margin:10px 0;
    opacity:0;
    text-align:center;
    width:90%;
}

/* PATHS */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:40px;
    justify-content:center;
    opacity:0;
}

.path-wrapper { position:relative; }

.path {
    width:200px;
    cursor:pointer;
    position:relative;
    z-index:5;
    transition:transform 1s ease, opacity 1s ease, left 1.5s ease;
}
.path.fade { opacity:0; }

.path.atmosphere { 
    animation:growRotate 2s infinite alternate ease-in-out;
    transform-origin:center bottom;
}
@keyframes growRotate {
    0% {transform:scale(1) rotate(0deg);}
    50% {transform:scale(1.03) rotate(1deg);}
    100% {transform:scale(1) rotate(-1deg);}
}

/* Ambient flare */
.path-flare {
    position:absolute;
    top:50%; left:50%;
    width:180px; height:180px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    pointer-events:none;
    opacity:0;
}

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
    margin-top:20px;
    text-align:center;
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#resultText {
    font-size:1.8em;
    margin-top:8px;
    opacity:0;
    transition:opacity 1s ease;
}

#resultImg {
    width:220px;
    margin:10px auto 0;
    opacity:0;
    transform:scale(1.5);
    transition:opacity 1.5s ease, transform 1.5s ease;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    .path-flare { width:120px; height:120px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>

<div id="container">
    <img id="logo" src="images/logo.png">

    <div id="introText">After walking for some time you reach a fork in the road...</div>
    <h1 class="flicker" id="chooseText">Choose your path</h1>

    <div id="pathsWrapper">
        <div class="path-wrapper">
            <div class="path-flare"></div>
            <img src="images/path1.png" class="path atmosphere" data-id="0">
        </div>
        <div class="path-wrapper">
            <div class="path-flare"></div>
            <img src="images/path2.png" class="path atmosphere" data-id="1">
        </div>
    </div>

    <div id="resultContainer">
        <img id="resultImg" src="">
        <div id="resultText"></div>
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", ()=>{
    const introText = document.getElementById('introText');
    const chooseText = document.getElementById('chooseText');
    const pathsWrapper = document.getElementById('pathsWrapper');
    const paths = document.querySelectorAll('.path');
    const resultText = document.getElementById('resultText');
    const resultImg = document.getElementById('resultImg');
    const qr = document.getElementById('qr');

    const pathFlares = document.querySelectorAll('.path-flare');

    let locked = false;
    const winningIndex = Math.floor(Math.random()*2);

    // --- Typing intro ---
    const text = introText.textContent;
    introText.textContent = '';
    let i=0;
    const typeInterval = setInterval(()=>{
        introText.textContent += text[i];
        i++;
        if(i>=text.length){
            clearInterval(typeInterval);
            setTimeout(()=>{
                introText.style.transition="opacity 1.5s ease";
                introText.style.opacity=0;
                setTimeout(()=>{
                    chooseText.style.transition="opacity 1s ease";
                    pathsWrapper.style.transition="opacity 1s ease";
                    chooseText.style.opacity=1;
                    pathsWrapper.style.opacity=1;

                    // Start alternating flare loop
                    let flareIndex = 0;
                    let flareTimer = setInterval(()=>{
                        if(locked){ pathFlares.forEach(f=>f.style.opacity=0); clearInterval(flareTimer); return; }
                        pathFlares.forEach((f,i)=>f.style.opacity=i===flareIndex?0.25:0);
                        flareIndex = (flareIndex+1)%pathFlares.length;
                    },600);
                },500);
            },1000);
        }
    },50);

    // Alternating path movement
    paths.forEach((path,index)=>{
        path.style.animationDelay = (index*0.5)+'s';
    });

    paths.forEach(path=>{
        const wrapper = path.parentElement;
        const flare = wrapper.querySelector('.path-flare');

        path.addEventListener('click',()=>{
            if(locked) return;
            locked=true;
            paths.forEach(p=>p.classList.remove('atmosphere'));
            pathFlares.forEach(f=>f.style.opacity=0);

            const id = Number(path.dataset.id);
            const selected = path;
            const nonSelected = [...paths].filter(p=>p!==selected)[0];

            // Fade out non-selected
            nonSelected.style.transition="opacity 2s ease";
            nonSelected.style.opacity=0;

            // Get position for castle/mansion
            const rect = selected.getBoundingClientRect();

            // Pulse for 2s
            selected.style.transition="transform 1.5s ease";
            selected.style.transform="scale(1.05)";
            setTimeout(()=>{
                // Drift to horizontal center & zoom/fade
                const wrapperRect = selected.parentElement.getBoundingClientRect();
                const centerX = wrapperRect.width/2 - rect.width/2;
                const offsetX = centerX - (rect.left - wrapperRect.left);
                selected.style.transition="left 2s ease, transform 2s ease, opacity 2s ease";
                selected.style.left = offsetX+"px";
                selected.style.transform="scale(1.3)";
                selected.style.opacity=0;
            },2000);

            // Reveal castle/mansion after zoom/fade
            setTimeout(()=>{
                resultImg.style.position='absolute';
                resultImg.style.left='50%';
                resultImg.style.top=rect.top + window.scrollY + 'px';
                resultImg.style.transform='translateX(-50%) scale(1.5)';
                resultImg.style.opacity=1;

                if(id===winningIndex){
                    resultImg.src="images/castle.png";
                    qr.style.display="block";
                    resultText.textContent="You reached the magical castle!";
                } else {
                    resultImg.src="images/mansion.png";
                    qr.style.display="none";
                    resultText.textContent="Oh no! You ended up in the haunted mansion!";
                }

                // Reverse scale for "coming out of path"
                setTimeout(()=>{
                    resultImg.style.transition="transform 1.5s ease";
                    resultImg.style.transform='translateX(-50%) scale(1)';
                    setTimeout(()=>{ resultText.style.opacity=1; },500);
                },50);

            },4500); // pulse + drift + zoom/fade
        });
    });
});
</script>
</body>
</html>
