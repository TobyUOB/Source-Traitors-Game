<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.5;}}
.flicker { animation: flicker 1.2s infinite alternate; }

#container {position:relative; z-index:5; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding-top:30px;}
#logo {width:100px; margin-bottom:14px; position:relative; z-index:10;}
#heading {font-size:2em; margin:10px 0; opacity:1; text-align:center; width:100%; transition:opacity 1s ease;}

#embers {position:fixed; inset:0; pointer-events:none; z-index:1;}
.ember {position:absolute; width:4px; height:4px; background:orange; border-radius:50%; box-shadow:0 0 10px orange; animation:emberRise 6s linear infinite;}
@keyframes emberRise {from{transform:translateY(100vh);opacity:0;}30%{opacity:1;}to{transform:translateY(-50px) translateX(-40px);opacity:0;}}

/* PATHS */
#pathsWrapper {position:relative; display:flex; gap:40px; margin-top:40px; justify-content:center; opacity:0; pointer-events:none; transition:opacity 1s ease;}
.path {width:200px; cursor:pointer; transition:transform .6s ease, opacity .6s ease, left 1.5s ease; position:relative; z-index:5;}
.path.fade {opacity:0;}

#flare {position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle, rgba(255,180,80,0.25) 0%, transparent 70%); top:50%; left:0; transform:translate(-50%, -50%); pointer-events:none; opacity:0;}

#resultContainer {position:absolute; display:flex; flex-direction:column; align-items:center; top:0; left:0; width:100%; pointer-events:none;}
#resultImg {width:220px; opacity:0; transition:opacity 1.5s ease, transform 1.5s ease;}
#resultText {font-size:1.8em; margin-top:10px; text-align:center; opacity:0; transition:opacity 1s ease;}
#qr {width:200px; margin-top:8px; display:none;}

@media(max-width:700px){.path{width:140px;}#flare{width:160px;height:160px;}#resultImg{width:160px;}}
</style>
</head>
<body>
<div class="symbol-overlay"></div>
<div id="embers"></div>

<div id="container">
    <img id="logo" src="images/logo.png">
    <h1 id="heading"></h1>

    <div id="pathsWrapper">
        <div id="flare"></div>
        <img src="images/path1.png" class="path" data-id="0">
        <img src="images/path2.png" class="path" data-id="1">
    </div>

    <div id="resultContainer">
        <img id="resultImg" src="">
        <div id="resultText"></div>
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
const heading=document.getElementById('heading');
const pathsWrapper=document.getElementById('pathsWrapper');
const paths=document.querySelectorAll('.path');
const flare=document.getElementById('flare');
const resultContainer=document.getElementById('resultContainer');
const resultText=document.getElementById('resultText');
const resultImg=document.getElementById('resultImg');
const qr=document.getElementById('qr');
const emberContainer=document.getElementById('embers');

let locked=true;
let winningIndex=Math.floor(Math.random()*2);
let pulseIndex=0;
let pulseTimer;

// Ambient embers
for(let i=0;i<20;i++){
    const e=document.createElement('div');
    e.className='ember';
    e.style.left=Math.random()*100+'%';
    e.style.animationDelay=Math.random()*6+'s';
    emberContainer.appendChild(e);
}

// TYPE INTRO TEXT
function typeText(text,cb){
    heading.textContent="";
    let i=0;
    const t=setInterval(()=>{
        heading.textContent+=text[i++];
        if(i>=text.length){clearInterval(t); cb();}
    },90);
}
typeText("After walking for sometime you reach a fork in the road...",()=>{
    setTimeout(()=>{
        heading.textContent="Choose your path";
        heading.classList.add("flicker");
        heading.style.opacity=1;
        pathsWrapper.style.opacity=1;
        pathsWrapper.style.pointerEvents="auto";
        startPulse();
        locked=false;
    },500);
});

// PATH PULSE LOOP (one at a time)
function startPulse(){
    pulseTimer=setInterval(()=>{
        paths.forEach(p=>p.style.transform="scale(1)");
        const p=paths[pulseIndex];
        p.style.transform="scale(1.06) rotate(1deg)";
        pulseIndex=(pulseIndex+1)%paths.length;
    },900);
}

// PATH SELECTION
paths.forEach(path=>{
    path.addEventListener('click',()=>{
        if(locked) return;
        locked=true;
        clearInterval(pulseTimer);

        const id=Number(path.dataset.id);
        const selected=path;
        const other=[...paths].filter(p=>p!==selected)[0];

        // Fade non-selected path first
        other.style.transition="opacity 1.5s ease";
        other.style.opacity=0;

        // Keep pulse for 1.5s then move central
        setTimeout(()=>{
            const rect=selected.getBoundingClientRect();
            const wrapperRect=pathsWrapper.getBoundingClientRect();
            const centerX=wrapperRect.width/2 - rect.width/2;
            const offsetX=centerX - (rect.left - wrapperRect.left);
            selected.style.position="relative";
            selected.style.left=offsetX+"px";

            // Slight pulse for 1s before zoom
            selected.style.transition="transform 0.8s ease";
            selected.style.transform="scale(1.08) rotate(1deg)";

            setTimeout(()=>{
                // Zoom + fade
                selected.style.transition="transform 1.5s ease, opacity 1.5s ease";
                selected.style.transform="scale(1.3)";
                selected.style.opacity=0;

                // 1s pause before castle/mansion reveal
                setTimeout(()=>{
                    // Get position for castle/mansion
                    const selRect=selected.getBoundingClientRect();
                    resultImg.src=id===winningIndex?"images/castle.png":"images/mansion.png";
                    resultImg.style.position="absolute";
                    resultImg.style.left=selRect.left + "px";
                    resultImg.style.top=selRect.top + "px";
                    resultImg.style.width=selRect.width + "px";
                    resultImg.style.opacity=0;
                    resultImg.style.transform="scale(1.3)"; // reverse zoom effect
                    resultImg.style.transition="opacity 1.5s ease, transform 1.5s ease";
                    document.body.appendChild(resultImg);

                    requestAnimationFrame(()=>{
                        resultImg.style.opacity=1;
                        resultImg.style.transform="scale(1)";
                    });

                    // Show text & QR below castle/mansion after fade
                    setTimeout(()=>{
                        resultText.style.opacity=1;
                        resultText.textContent=id===winningIndex?"You reached the magical castle!":"Oh no! You ended up in the haunted mansion!";
                        if(id===winningIndex) qr.style.display="block";
                    },1600);

                },1000);
            },1000);
        },1600);
    });
});
});
</script>
</body>
</html>
