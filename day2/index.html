<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

.flicker {animation: flicker 1.2s infinite alternate;}
@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.5;}}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    position:relative;
    z-index:10;
}

h1 {font-size:2em; margin:10px 0; text-align:center; width:100%;}

#introHeading {
    font-size:1.8em;
    margin-top:30px;
    text-align:center;
    opacity:1;
}

#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    justify-content:center;
    margin-top:30px;
    opacity:0;
}

.pathContainer {
    position:relative;
}

.pathGlow {
    position:absolute;
    inset: -20px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(30,30,30,0.35) 0%, transparent 70%);
    opacity:0.6;
    pointer-events:none;
    z-index:0;
}

.path {
    width:200px;
    cursor:pointer;
    position:relative;
    z-index:1;
    transition:transform 0.6s ease, opacity 1s ease, left 1.5s ease;
}

.path.fade {opacity:0;}

#resultContainer {
    margin-top:12px;
    text-align:center;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
}

#resultText {font-size:1.8em; margin-bottom:8px;}
#resultImg {width:220px; margin-bottom:8px; opacity:0; transition: transform 1.2s ease, opacity 1.2s ease;}
#qr {width:200px; display:none;}

@media(max-width:700px){
    .path { width:140px; }
    #resultImg { width:160px; }
}
</style>
</head>

<body>
<div class="symbol-overlay"></div>

<div id="container">
    <img id="logo" src="images/logo.png">
    <h1 id="introHeading"></h1>

    <div id="pathsWrapper">
        <div class="pathContainer">
            <div class="pathGlow"></div>
            <img src="images/path1.png" class="path" data-id="0">
        </div>
        <div class="pathContainer">
            <div class="pathGlow"></div>
            <img src="images/path2.png" class="path" data-id="1">
        </div>
    </div>

    <div id="resultContainer">
        <img id="resultImg" src="">
        <div id="resultText"></div>
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const introHeading = document.getElementById('introHeading');
const pathsWrapper = document.getElementById('pathsWrapper');
const pathContainers = document.querySelectorAll('.pathContainer');
const paths = document.querySelectorAll('.path');
const glows = document.querySelectorAll('.pathGlow');
const resultContainer = document.getElementById('resultContainer');
const resultImg = document.getElementById('resultImg');
const resultText = document.getElementById('resultText');
const qr = document.getElementById('qr');

let locked=true;
let pulseIndex=0;
let pulseTimer;

// Random winning path
const winningIndex = Math.floor(Math.random()*2);

// Intro typing
function typeText(text, cb){
    let i=0;
    introHeading.textContent="";
    const t=setInterval(()=>{
        introHeading.textContent+=text[i++];
        if(i===text.length){clearInterval(t);cb&&cb();}
    },95);
}

typeText("After walking for sometime you reach a fork in the road...",()=>{
    setTimeout(()=>{
        introHeading.style.transition="opacity 1s ease";
        introHeading.style.opacity=0;
    },2000);

    // Fade in choose your path + paths after intro
    setTimeout(()=>{
        introHeading.textContent="Choose your path";
        introHeading.style.opacity=1;
        introHeading.classList.add("flicker");
        pathsWrapper.style.transition="opacity 1.5s ease";
        pathsWrapper.style.opacity=1;
        locked=false;
        startPulse();
    },3500);
});

// Pulse each path one at a time
function startPulse(){
    pulseTimer=setInterval(()=>{
        paths.forEach(p=>p.style.transform="scale(1)");
        glows.forEach(g=>g.style.opacity=0.6);
        const idx=pulseIndex%paths.length;
        paths[idx].style.transform="scale(1.08) rotate(1deg)";
        pulseIndex=(pulseIndex+1)%paths.length;
    },900);
}

// Path selection
paths.forEach(path=>{
    path.addEventListener('click',()=>{
        if(locked)return;
        locked=true;
        clearInterval(pulseTimer);

        const id = Number(path.dataset.id);
        const selectedContainer = path.parentElement;
        const nonSelected = [...paths].filter(p=>p!==path)[0];

        // Fade out non-selected path + glow
        nonSelected.style.opacity=0;
        nonSelected.parentElement.querySelector('.pathGlow').style.opacity=0;

        // Wait 1.5s then move selected to center and zoom
        setTimeout(()=>{
            const rect = selectedContainer.getBoundingClientRect();
            const wrapperRect = pathsWrapper.getBoundingClientRect();
            const centerX = wrapperRect.width/2 - rect.width/2;
            const offsetX = centerX - (rect.left - wrapperRect.left);
            selectedContainer.style.position='relative';
            selectedContainer.style.left = offsetX+'px';

            // Zoom/fade for 2s
            path.style.transition="transform 2s ease, opacity 2s ease";
            path.style.transform="scale(1.5)";
            path.style.opacity=0;
        },1500);

        // After zoom/fade + 1s pause, show castle/mansion
        setTimeout(()=>{
            const rect = selectedContainer.getBoundingClientRect();
            resultContainer.style.position='absolute';
            resultContainer.style.left = rect.left + 'px';
            resultContainer.style.top = rect.top + 'px';
            resultContainer.style.opacity=1;

            if(id===winningIndex){
                resultImg.src="images/castle.png";
                resultText.textContent="You reached the magical castle!";
                qr.style.display="block";
            } else {
                resultImg.src="images/mansion.png";
                resultText.textContent="Oh no! You ended up in the haunted mansion!";
            }

            // Reverse zoom fade-in effect
            resultImg.style.transform="scale(1.5)";
            resultImg.style.opacity=0;
            setTimeout(()=>{
                resultImg.style.transition="transform 1.5s ease, opacity 1.5s ease";
                resultImg.style.transform="scale(1)";
                resultImg.style.opacity=1;
            },50);
        },3500);
    });
});
});
</script>
</body>
</html>
