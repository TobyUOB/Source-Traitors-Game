<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker {
    0%,100% { opacity:1; }
    50% { opacity:0.5; }
}
.flicker {
    animation: flicker 1.2s infinite alternate;
}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    position:relative;
    z-index:10;
}

h1 {
    font-size:2em;
    margin:10px 0;
    opacity:1;
    text-align:center;
    width:100%;
}

/* AMBIENT EMBERS */
#embers {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}
.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation:emberRise 6s linear infinite;
}
@keyframes emberRise {
    from {transform:translateY(100vh); opacity:0;}
    30% {opacity:1;}
    to {transform:translateY(-50px) translateX(-40px); opacity:0;}
}

/* PATHS */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:60px;
    justify-content:center;
}

/* Ominous black flickering glow behind paths */
.path-wrapper {
    position:relative;
    display:inline-block;
}
.path-glow {
    position:absolute;
    inset:-10px;
    background: radial-gradient(circle, rgba(0,0,0,0.35) 0%, transparent 70%);
    border-radius:15px;
    z-index:1;
    animation: glowFlicker 1.5s infinite alternate;
    pointer-events:none;
}
@keyframes glowFlicker {
    0% {opacity:0.2;}
    50% {opacity:0.35;}
    100% {opacity:0.2;}
}

#flare {
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,80,0.25) 0%, transparent 70%);
    top:50%;
    left:0;
    transform:translate(-50%, -50%);
    pointer-events:none;
    opacity:0;
}

.path {
    width:200px;
    cursor:pointer;
    transition:transform 1s ease, opacity 1s ease, left 1.5s ease;
    position:relative;
    z-index:5;
}

.path.fade {
    opacity:0;
}

/* Pulse animation for selected path */
@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.05);}
    100% {transform: scale(1);}
}
.path.pulse {
    animation: pulse 2s infinite ease-in-out;
}

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
    margin-top:12px;
    text-align:center;
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#resultText {
    font-size:1.8em;
    margin-bottom:8px;
}

#resultImg {
    width:220px;
    margin:10px auto 0;
    opacity:0;
    transition:opacity 1.5s ease;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #flare { width:160px; height:160px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>
<div id="embers"></div>

<div id="container">
    <img id="logo" src="images/logo.png">

    <h1 class="flicker">Choose your path</h1>

    <div id="pathsWrapper">
        <div class="path-wrapper">
            <div class="path-glow"></div>
            <img src="images/path1.png" class="path" data-id="0">
        </div>
        <div class="path-wrapper">
            <div class="path-glow"></div>
            <img src="images/path2.png" class="path" data-id="1">
        </div>
        <div id="flare"></div>
    </div>

    <div id="resultContainer">
        <div id="resultText"></div>
        <img id="resultImg" src="">
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
const paths = document.querySelectorAll('.path');
const resultText = document.getElementById('resultText');
const resultImg = document.getElementById('resultImg');
const qr = document.getElementById('qr');
const flare = document.getElementById('flare');
const emberContainer = document.getElementById('embers');

let locked = false;

// Random winning path
const winningIndex = Math.floor(Math.random()*2);

// Create ambient embers
for(let i=0;i<20;i++){
    const e = document.createElement('div');
    e.className='ember';
    e.style.left = Math.random()*100+'%';
    e.style.animationDelay = Math.random()*6+'s';
    emberContainer.appendChild(e);
}

// Flare animation loop
let flareIndex = 0;
let flareTimer = setInterval(()=>{
    paths.forEach((p,i)=> p.style.zIndex = 5);
    const p = paths[flareIndex];
    const rect = p.getBoundingClientRect();
    flare.style.left = rect.left + rect.width/2 + 'px';
    flare.style.top = rect.top + rect.height/2 + 'px';
    flare.style.opacity = 0.25;
    setTimeout(()=>flare.style.opacity=0,500);
    flareIndex = (flareIndex +1)%paths.length;
},900);

// Path selection
paths.forEach(path=>{
    path.addEventListener('click',()=>{
        if(locked) return;
        locked = true;
        clearInterval(flareTimer);

        const id = Number(path.dataset.id);

        const selectedPath = path;
        const nonSelected = [...paths].filter(p=>p!==selectedPath)[0];

        // 1. Slowly fade out non-selected path
        nonSelected.style.transition = "opacity 2s ease";
        nonSelected.style.opacity = 0;

        // 2. After non-selected path fully faded (2s)
        setTimeout(()=>{
            // Add pulse to selected path
            selectedPath.classList.add('pulse');

            // Move selected path to center horizontally slowly
            const rect = selectedPath.getBoundingClientRect();
            const wrapperRect = selectedPath.parentElement.getBoundingClientRect();
            const centerX = wrapperRect.width/2 - rect.width/2;
            const offsetX = centerX - (rect.left - wrapperRect.left);
            selectedPath.style.position = 'relative';
            selectedPath.style.transition = "left 2s ease";
            selectedPath.style.left = offsetX + 'px';
        },2000);

        // 3. After move (~2s), zoom + fade slowly (~3s)
        setTimeout(()=>{
            selectedPath.style.transition = "transform 3s ease, opacity 3s ease";
            selectedPath.style.transform = "scale(1.2)";
            selectedPath.style.opacity = 0;
        }, 4000);

        // 4. After fade (~3s), show castle/mansion in original horizontal position
        setTimeout(()=>{
            if(id===winningIndex){
                resultImg.src = "images/castle.png";
                resultText.textContent = "You reached the magical castle!";
                qr.style.display="block";
            }else{
                resultImg.src = "images/mansion.png";
                resultText.textContent = "Oh no! You ended up in the haunted mansion!";
            }
            resultImg.style.opacity = 1;
        }, 7000); // 2 + 2 + 3s sequence

        // Ember burst immediately on click
        for(let i=0;i<15;i++){
            const e = document.createElement('div');
            e.className='ember';
            const rect = selectedPath.getBoundingClientRect();
            e.style.left = rect.left + Math.random()*rect.width + 'px';
            e.style.top = rect.top + Math.random()*rect.height + 'px';
            e.style.animationDuration = 2 + Math.random()*2 + 's';
            document.body.appendChild(e);
            setTimeout(()=>e.remove(),4000);
        }
    });
});
});
</script>
</body>
</html>
