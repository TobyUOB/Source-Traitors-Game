<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
  margin:0;
  background:#0a0805;
  color:white;
  font-family:'Cinzel', serif;
  overflow-x:hidden;
  overflow-y:auto;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
  position:fixed;
  inset:0;
  background:url('images/symbols.png') repeat;
  background-size:180px;
  opacity:0.1;
  pointer-events:none;
  z-index:0;
  animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
  0% {opacity:0.08; transform:rotate(0deg);}
  50% {opacity:0.15; transform:rotate(1deg);}
  100% {opacity:0.08; transform:rotate(-1deg);}
}

#container {
  position:relative;
  z-index:5;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:30px;
}

#logo {
  width:100px;
  margin-bottom:14px;
}

h1 {
  font-size:2em;
  margin:10px 0;
  text-align:center;
  width:100%;
  animation:flicker 1.2s infinite alternate;
}
@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.5;}}

/* PATHS WRAPPER */
#pathsWrapper {
  display:flex;
  gap:60px;
  justify-content:center;
  align-items:flex-start;
  margin-top:60px;
  position:relative;
  height:250px;
}

/* Path + glow */
.path-wrapper {
  position:relative;
}
.path-glow {
  position:absolute;
  inset:-25px;
  background: radial-gradient(circle, rgba(255,180,80,0.4) 0%, transparent 70%);
  border-radius:25px;
  z-index:1;
  pointer-events:none;
  animation: glowFlicker 1.2s infinite alternate;
}
@keyframes glowFlicker {0%{opacity:0.3;}50%{opacity:0.55;}100%{opacity:0.3;}}

.path {
  width:200px;
  cursor:pointer;
  z-index:5;
  transition: transform 1s ease, opacity 1s ease;
}
.path.pulse { animation:pulse 2s infinite ease-in-out; }
@keyframes pulse {0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
  position:relative;
  text-align:center;
  margin-top:20px;
}
#resultImg {
  width:220px;
  opacity:0;
  transform:scale(1.5);
  transition: transform 1.5s ease, opacity 1.5s ease;
  display:block;
  margin:0 auto;
}
#resultText {
  font-size:1.8em;
  margin-top:10px;
}
#qr {
  width:200px;
  margin-top:6px;
  display:none;
  margin-left:auto;
  margin-right:auto;
}

/* MOBILE */
@media(max-width:700px){
  .path { width:140px; }
  #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>

<div id="container">
  <img id="logo" src="images/logo.png">
  <h1>Choose your path</h1>

  <div id="pathsWrapper">
    <div class="path-wrapper">
      <div class="path-glow"></div>
      <img src="images/path1.png" class="path" data-id="0">
    </div>
    <div class="path-wrapper">
      <div class="path-glow"></div>
      <img src="images/path2.png" class="path" data-id="1">
    </div>
  </div>

  <div id="resultContainer">
    <img id="resultImg" src="">
    <div id="resultText"></div>
    <img id="qr" src="qr/day2prize.png">
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const paths = document.querySelectorAll('.path');
  const resultImg = document.getElementById('resultImg');
  const resultText = document.getElementById('resultText');
  const qr = document.getElementById('qr');
  let locked=false;
  const winningIndex=Math.floor(Math.random()*2);

  // Path click
  paths.forEach(path=>{
    path.addEventListener('click',()=>{
      if(locked) return;
      locked=true;

      const id=Number(path.dataset.id);
      const selected=path;
      const nonSelected=[...paths].filter(p=>p!==selected)[0];

      // Fade out non-selected path
      nonSelected.style.transition="opacity 2s ease";
      nonSelected.style.opacity=0;

      // After fade out, drift selected to center
      setTimeout(()=>{
        selected.classList.add('pulse');
        selected.style.position='absolute';
        const wrapperRect=selected.parentElement.getBoundingClientRect();
        const rect=selected.getBoundingClientRect();
        const currentLeft=rect.left - wrapperRect.left;
        const pageCenter=(window.innerWidth - rect.width)/2;
        const delta=pageCenter - rect.left;
        selected.style.transition="left 3s ease";
        selected.style.left= (currentLeft + delta) + "px";
      },2000);

      // Keep pulsing longer before zoom/fade
      setTimeout(()=>{
        selected.style.transition="transform 2.5s ease, opacity 2.5s ease";
        selected.style.transform="scale(3)";
        selected.style.opacity=0;
      },5500);

      // Show result in same original path position
      setTimeout(()=>{
        const rect=selected.getBoundingClientRect();
        resultImg.style.position='absolute';
        resultImg.style.left=rect.left+'px';
        resultImg.style.top=rect.top+'px';
        resultImg.style.opacity=1;
        resultImg.style.transform='scale(3)';

        if(id===winningIndex){
          resultImg.src='images/castle.png';
          resultText.textContent="You reached the magical castle!";
          qr.style.display="block";
        } else{
          resultImg.src='images/mansion.png';
          resultText.textContent="Oh no! You ended up in the haunted mansion!";
          qr.style.display="none";
        }

        // Smoothly scale result down to normal
        setTimeout(()=>{
          resultImg.style.transition="transform 1.5s ease";
          resultImg.style.transform="scale(1)";
        },50);
      },8500);

    });
  });
});
</script>
</body>
</html>
