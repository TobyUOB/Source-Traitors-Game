<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker {
    0%,100% { opacity:1; }
    50% { opacity:0.5; }
}
.flicker {
    animation: flicker 1.2s infinite alternate;
}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    position:relative;
    z-index:10;
}

h1 {
    font-size:2em;
    margin:10px 0;
    opacity:1;
    text-align:center;
    width:100%;
    transition:opacity 1.2s ease;
}

/* AMBIENT EMBERS */
#embers {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}
.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation:emberRise 6s linear infinite;
}
@keyframes emberRise {
    from {transform:translateY(100vh); opacity:0;}
    30% {opacity:1;}
    to {transform:translateY(-50px) translateX(-40px); opacity:0;}
}

/* PATHS */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:60px;
    justify-content:center;
}

#flare {
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,80,0.25) 0%, transparent 70%);
    top:50%;
    left:0;
    transform:translate(-50%, -50%);
    pointer-events:none;
    opacity:0;
}

.path {
    width:200px;
    cursor:pointer;
    transition:transform .6s ease, opacity .6s ease;
    position:relative;
    z-index:5;
}

.path.fade {
    opacity:0;
    transform:scale(0.8);
}

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
    margin-top:12px;
    text-align:center;
    position:relative;
    z-index:5;
}

#resultText {
    font-size:1.8em;
    margin-bottom:8px;
}

#resultImg {
    width:220px;
    margin:10px auto 0;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #flare { width:160px; height:160px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>
<div id="embers"></div>

<div id="container">
    <img id="logo" src="images/logo.png">

    <h1 class="flicker">Choose your path</h1>

    <div id="pathsWrapper">
        <div id="flare"></div>
        <img src="images/path1.png" class="path" data-id="0">
        <img src="images/path2.png" class="path" data-id="1">
    </div>

    <div id="resultContainer">
        <div id="resultText"></div>
        <img id="resultImg" src="">
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
const paths = document.querySelectorAll('.path');
const resultText = document.getElementById('resultText');
const resultImg = document.getElementById('resultImg');
const qr = document.getElementById('qr');
const flare = document.getElementById('flare');
const emberContainer = document.getElementById('embers');

let locked = false;

// Random winning path
const winningIndex = Math.floor(Math.random()*2);

// Create ambient embers
for(let i=0;i<20;i++){
    const e = document.createElement('div');
    e.className='ember';
    e.style.left = Math.random()*100+'%';
    e.style.animationDelay = Math.random()*6+'s';
    emberContainer.appendChild(e);
}

// Flare animation loop
let flareIndex = 0;
let flareTimer = setInterval(()=>{
    paths.forEach((p,i)=> p.style.zIndex = 5);
    const p = paths[flareIndex];
    const rect = p.getBoundingClientRect();
    flare.style.left = rect.left + rect.width/2 + 'px';
    flare.style.top = rect.top + rect.height/2 + 'px';
    flare.style.opacity = 0.25;
    setTimeout(()=>flare.style.opacity=0,500);
    flareIndex = (flareIndex +1)%paths.length;
},900);

// Path selection
paths.forEach(path=>{
    path.addEventListener('click',()=>{
        if(locked) return;
        locked = true;
        clearInterval(flareTimer);

        const id = Number(path.dataset.id);

        paths.forEach(p=>{
            if(p!==path) p.classList.add('fade');
        });
        path.style.transform = "scale(1.1)";

        // Ember burst at selected path
        for(let i=0;i<15;i++){
            const e = document.createElement('div');
            e.className='ember';
            const rect = path.getBoundingClientRect();
            e.style.left = rect.left + Math.random()*rect.width + 'px';
            e.style.top = rect.top + Math.random()*rect.height + 'px';
            e.style.animationDuration = 2 + Math.random()*2 + 's';
            document.body.appendChild(e);
            setTimeout(()=>e.remove(),4000);
        }

        setTimeout(()=>{
            if(id===winningIndex){
                resultText.textContent = "You reached the magical castle!";
                resultImg.src = "images/castle.png";
                qr.style.display="block";
            }else{
                resultText.textContent = "Oh no! You ended up in the haunted mansion!";
                resultImg.src = "images/mansion.png";
            }
        },500);
    });
});
});
</script>
</body>
</html>
