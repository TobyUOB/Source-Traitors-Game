<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* Flicker heading */
@keyframes flicker {
    0%,100% { opacity:1; }
    50% { opacity:0.5; }
}
.flicker { animation: flicker 1.2s infinite alternate; }

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
}

h1 {
    font-size:2em;
    margin:10px 0;
    text-align:center;
    width:100%;
}

/* PATHS WRAPPER */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:60px;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease;
}

/* Flare behind paths */
#flare {
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,180,80,0.15) 0%, transparent 70%);
    top:50%;
    left:0;
    transform:translate(-50%, -50%);
    pointer-events:none;
    opacity:0;
}

/* PATHS */
.path {
    width:200px;
    cursor:pointer;
    transition:transform 0.6s ease, opacity 0.6s ease, left 1.5s ease;
    position:relative;
}
.path.fade { opacity:0; }

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
    position:relative;
    margin-top:12px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
}

#resultText {
    font-size:1.8em;
    margin-bottom:8px;
}

#resultImg {
    width:220px;
    margin:10px auto 0;
    opacity:0;
    transition:opacity 1.5s ease, transform 1.5s ease;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #flare { width:160px; height:160px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>

<div id="container">

    <img id="logo" src="images/logo.png">

    <h1 id="introHeading" style="opacity:1;"></h1>
    <h1 id="chooseHeading" style="opacity:0;">Choose your path</h1>

    <div id="pathsWrapper">
        <div id="flare"></div>
        <img src="images/path1.png" class="path" data-id="0">
        <img src="images/path2.png" class="path" data-id="1">
    </div>

    <div id="resultContainer">
        <div id="resultText"></div>
        <img id="resultImg" src="">
        <img id="qr" src="qr/day2prize.png">
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const introHeading = document.getElementById('introHeading');
const chooseHeading = document.getElementById('chooseHeading');
const pathsWrapper = document.getElementById('pathsWrapper');
const paths = document.querySelectorAll('.path');
const flare = document.getElementById('flare');
const resultContainer = document.getElementById('resultContainer');
const resultText = document.getElementById('resultText');
const resultImg = document.getElementById('resultImg');
const qr = document.getElementById('qr');

let locked = true;
let pulseIndex = 0;
let pulseTimer;

// Random winning path
const winningIndex = Math.floor(Math.random()*2);

// Typed intro text
function typeText(el, text, callback) {
    let i = 0;
    el.textContent = "";
    const t = setInterval(()=>{
        el.textContent += text[i++];
        if(i===text.length){ clearInterval(t); callback && callback(); }
    }, 60);
}

// Alternating pulse effect for paths
function startPulse() {
    pulseTimer = setInterval(()=>{
        paths.forEach(p=>p.style.transform="scale(1)");
        const p = paths[pulseIndex];
        p.style.transform = "scale(1.06) rotate(1deg)";
        pulseIndex = (pulseIndex+1)%paths.length;
    }, 900);
}

// Show flare on path
function showFlare(path) {
    const rect = path.getBoundingClientRect();
    flare.style.left = rect.left + rect.width/2 + 'px';
    flare.style.top = rect.top + rect.height/2 + 'px';
    flare.style.opacity = 0.25;
    setTimeout(()=>flare.style.opacity=0,500);
}

// Intro sequence
typeText(introHeading, "After walking for some time you reach a fork in the road...", ()=>{
    setTimeout(()=>{
        // Fade out intro, fade in choose heading and paths
        introHeading.style.transition="opacity 1s ease";
        introHeading.style.opacity=0;
        chooseHeading.style.opacity=1;
        chooseHeading.classList.add('flicker');
        pathsWrapper.style.opacity=1;
        pathsWrapper.style.pointerEvents="auto";
        locked=false;
        startPulse();
    },800);
});

// Path selection
paths.forEach(path=>{
    path.addEventListener('click', ()=>{
        if(locked) return;
        locked=true;
        clearInterval(pulseTimer);

        const id = Number(path.dataset.id);
        const nonSelected = [...paths].filter(p=>p!==path)[0];
        nonSelected.classList.add('fade');

        // Get path position relative to container
        const containerRect = document.getElementById('container').getBoundingClientRect();
        const pathRect = path.getBoundingClientRect();
        const relLeft = pathRect.left - containerRect.left;
        const relTop = pathRect.top - containerRect.top;

        // Center path horizontally and zoom
        const wrapperWidth = pathsWrapper.offsetWidth;
        const centerX = wrapperWidth/2 - pathRect.width/2;
        const offsetX = centerX - relLeft;
        path.style.position="relative";
        path.style.left=offsetX+"px";

        setTimeout(()=>{
            path.style.transition="transform 2.5s ease, opacity 2.5s ease";
            path.style.transform="scale(1.5)";
            path.style.opacity=0;
        },500);

        // Show castle/mansion in same container-relative position
        setTimeout(()=>{
            resultImg.style.position="absolute";
            resultImg.style.left = relLeft + 'px';
            resultImg.style.top = relTop + 'px';
            resultImg.style.opacity=1;
            resultImg.style.transform="scale(1.2)";
            resultImg.src = id===winningIndex ? "images/castle.png" : "images/mansion.png";

            // After image shown, fade in result text & QR
            setTimeout(()=>{
                resultContainer.style.opacity=1;
                resultText.textContent = id===winningIndex ? "You reached the magical castle!" : "Oh no! You ended up in the haunted mansion!";
                if(id===winningIndex) qr.style.display="block";
            },800);
        },3000);
    });
});
});
</script>
</body>
</html>
