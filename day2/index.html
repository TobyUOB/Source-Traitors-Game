<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
}

/* SYMBOLS OVERLAY */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
.flicker { animation: flicker 1.2s infinite alternate; }

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo {
    width:100px;
    margin-bottom:14px;
    z-index:10;
}

h1 {
    font-size:2em;
    margin:10px 0;
    opacity:0;
    text-align:center;
    width:100%;
    transition:opacity 1s ease;
}

/* AMBIENT EMBERS */
#embers {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}
.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation:emberRise 6s linear infinite;
}
@keyframes emberRise {
    from {transform:translateY(100vh); opacity:0;}
    30% {opacity:1;}
    to {transform:translateY(-50px) translateX(-40px); opacity:0;}
}

/* PATHS */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    margin-top:40px;
}

.path {
    width:200px;
    cursor:pointer;
    position:relative;
    z-index:5;
    transition:transform .6s ease, opacity .6s ease, left 1.5s ease;
}

.path.fade { opacity:0; }

.path-glow {
    box-shadow:0 0 20px 6px rgba(50,50,50,0.6);
    border-radius:10px;
}

/* RESULT IMAGE + TEXT + QR */
#resultContainer {
    text-align:center;
    margin-top:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

#resultText {
    font-size:1.8em;
    margin-top:8px;
    opacity:0;
    transition:opacity 1s ease;
}

#resultImg {
    width:220px;
    margin-bottom:8px;
    opacity:0;
    transition:opacity 1.5s ease, transform 1.5s ease;
}

#qr {
    width:200px;
    margin-top:8px;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>
<div id="embers"></div>

<div id="container">
    <img id="logo" src="images/logo.png">

    <h1 id="introHeading"></h1>
    <h1 id="mainHeading">Choose your path</h1>

    <div id="pathsWrapper">
        <img src="images/path1.png" class="path" data-id="0">
        <img src="images/path2.png" class="path" data-id="1">
    </div>

    <div id="resultContainer">
        <img id="resultImg" src="">
        <div id="resultText"></div>
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const introHeading = document.getElementById('introHeading');
const mainHeading = document.getElementById('mainHeading');
const pathsWrapper = document.getElementById('pathsWrapper');
const paths = document.querySelectorAll('.path');
const resultImg = document.getElementById('resultImg');
const resultText = document.getElementById('resultText');
const qr = document.getElementById('qr');

let locked = true;
let winningIndex = Math.floor(Math.random()*2);
let pulseIndex = 0;
let pulseTimer;

// Intro typing
function typeText(el, text, cb){
    let i=0;
    el.textContent = "";
    const t = setInterval(()=>{
        el.textContent += text[i++];
        if(i===text.length){
            clearInterval(t);
            cb && cb();
        }
    },90);
}

// Show main heading + paths after intro
function showPaths(){
    mainHeading.style.opacity = 1;
    pathsWrapper.style.opacity = 1;
    pathsWrapper.style.pointerEvents = "auto";

    // Add glow
    paths.forEach(p=>p.classList.add('path-glow'));

    startPulse();
    locked = false;
}

// Pulse loop for idle paths (one at a time)
function startPulse(){
    pulseTimer = setInterval(()=>{
        paths.forEach(p=>p.style.transform='scale(1) rotate(0deg)');
        const p = paths[pulseIndex];
        p.style.transform='scale(1.05) rotate(1deg)';
        pulseIndex = (pulseIndex+1)%paths.length;
    },900);
}

// Handle selection
paths.forEach(path=>{
    path.addEventListener('click', ()=>{
        if(locked) return;
        locked=true;
        clearInterval(pulseTimer);

        const id = Number(path.dataset.id);
        const nonSelected = [...paths].filter(p=>p!==path)[0];

        // Remove glow
        paths.forEach(p=>p.classList.remove('path-glow'));

        // Fade out non-selected path
        nonSelected.style.transition = "opacity 1.5s ease";
        nonSelected.style.opacity=0;

        // After fade out, move selected path to center
        setTimeout(()=>{
            const rect = path.getBoundingClientRect();
            const parentRect = pathsWrapper.getBoundingClientRect();
            const centerX = parentRect.width/2 - rect.width/2;
            const offsetX = centerX - (rect.left - parentRect.left);
            path.style.left = offsetX+'px';

            // Keep pulse a bit before zoom out
            setTimeout(()=>{
                path.style.transition = "transform 2s ease, opacity 2s ease";
                path.style.transform="scale(1.3)";
                path.style.opacity=0;

                // After path zoom fade, show castle/mansion
                setTimeout(()=>{
                    resultImg.src = id===winningIndex ? 'images/castle.png' : 'images/mansion.png';
                    resultImg.style.opacity=1;
                    resultImg.style.transform="scale(1.3)";
                    setTimeout(()=>{
                        resultImg.style.transition="transform 1.2s ease, opacity 1.2s ease";
                        resultImg.style.transform="scale(1)";
                    },50);

                    // Show text & qr after reverse zoom
                    setTimeout(()=>{
                        if(id===winningIndex){ qr.style.display='block'; resultText.textContent="You reached the magical castle!"; }
                        else { resultText.textContent="Oh no! You ended up in the haunted mansion!"; }
                        resultText.style.opacity=1;
                    },1300);

                },2100); // pause after zoom out
            },600); // pulse time before zoom
        },1600); // non-selected fade
    });
});

// Start typing intro
typeText(introHeading,"After walking for some time you reach a fork in the road...",()=>{
    setTimeout(()=>{
        introHeading.style.opacity=0;
        showPaths();
    },800);
});
});
</script>
</body>
</html>
