<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 – Choose a Path</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
    overflow-y:auto;
}

/* SYMBOLS BACKGROUND */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px;
    opacity:0.1;
    pointer-events:none;
    z-index:0;
    animation: symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0% {opacity:0.08; transform:rotate(0deg);}
    50% {opacity:0.15; transform:rotate(1deg);}
    100% {opacity:0.08; transform:rotate(-1deg);}
}

/* FLICKER HEADING */
@keyframes flicker {0%,100%{opacity:1;}50%{opacity:0.5;}}
.flicker {animation:flicker 1.2s infinite alternate;}

#container {
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
}

#logo { width:100px; margin-bottom:14px; z-index:10; position:relative; }
h1 { font-size:2em; margin:10px 0; opacity:1; text-align:center; width:100%; }

/* PATHS */
#pathsWrapper {
    position:relative;
    display:flex;
    gap:40px;
    margin-top:60px;
    justify-content:center;
}
.path-wrapper { position:relative; }
.path {
    width:200px;
    cursor:pointer;
    position:relative;
    z-index:5;
    transition:transform 1s ease, opacity 1s ease, left 1.5s ease;
}
.path.fade { opacity:0; }
.path.pulse { animation:pulse 1.5s infinite ease-in-out alternate; }
@keyframes pulse {0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

/* ALTERNATING LIGHTS */
.path-light {
    position:absolute;
    top:-10px; left:-10px; right:-10px; bottom:-10px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,255,255,0.1);
    pointer-events:none;
    opacity:0;
}
@keyframes alternateGlow {0%,100%{opacity:0.05;}50%{opacity:0.15;}}
.path-light.animate { animation:alternateGlow 1s infinite alternate; }

/* RESULT IMAGE + TEXT + QR */
#resultContainer { margin-top:20px; text-align:center; position:relative; z-index:5; display:flex; flex-direction:column; align-items:center; }
#resultText { font-size:1.8em; margin-top:8px; opacity:0; transition:opacity 1s ease; }
#resultImg { width:220px; margin:10px auto 0; opacity:0; transform:scale(1.5); transition:opacity 1.5s ease, transform 1.5s ease; }
#qr { width:200px; margin-top:8px; display:none; }

/* MOBILE */
@media(max-width:700px){
    .path { width:140px; }
    #resultImg { width:160px; }
}
</style>
</head>
<body>
<div class="symbol-overlay"></div>

<div id="container">
    <img id="logo" src="images/logo.png">
    <h1 class="flicker">Choose your path</h1>

    <div id="pathsWrapper">
        <div class="path-wrapper">
            <div class="path-light animate"></div>
            <img src="images/path1.png" class="path" data-id="0">
        </div>
        <div class="path-wrapper">
            <div class="path-light animate"></div>
            <img src="images/path2.png" class="path" data-id="1">
        </div>
    </div>

    <div id="resultContainer">
        <img id="resultImg" src="">
        <div id="resultText"></div>
        <img id="qr" src="qr/day2prize.png">
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const paths = document.querySelectorAll('.path');
    const resultText = document.getElementById('resultText');
    const resultImg = document.getElementById('resultImg');
    const qr = document.getElementById('qr');

    let locked = false;
    const winningIndex = Math.floor(Math.random()*2);

    paths.forEach(path=>{
        const light = path.parentElement.querySelector('.path-light');

        path.addEventListener('click', () => {
            if(locked) return;
            locked = true;

            // Remove alternating lights
            document.querySelectorAll('.path-light').forEach(l => l.style.display='none');

            const id = Number(path.dataset.id);
            const selected = path;
            const nonSelected = [...paths].filter(p=>p!==selected)[0];

            // Fade out non-selected path
            nonSelected.style.transition = "opacity 2s ease";
            nonSelected.style.opacity = 0;

            // Get path original position for result placement
            const rect = selected.getBoundingClientRect();

            // Pulse before drift/zoom
            selected.classList.add('pulse');

            setTimeout(()=>{
                selected.classList.remove('pulse');

                // Drift to horizontal center
                const wrapperRect = selected.parentElement.getBoundingClientRect();
                const centerX = wrapperRect.width/2 - rect.width/2;
                const offsetX = centerX - (rect.left - wrapperRect.left);

                selected.style.transition = "left 1.5s ease, transform 2s ease, opacity 2s ease";
                selected.style.left = offsetX + "px";

                // Zoom and fade out
                selected.style.transform = "scale(1.3)";
                selected.style.opacity = 0;

            }, 2000); // pulse 2s

            // Show castle/mansion after selected path zoom/fade (2s)
            setTimeout(()=>{
                resultImg.style.position = 'absolute';
                resultImg.style.left = '50%';
                resultImg.style.transform = 'translateX(-50%) scale(3)';
                resultImg.style.top = rect.top + window.scrollY + "px";
                resultImg.style.opacity = 1;

                if(id === winningIndex){
                    resultImg.src = "images/castle.png";
                    qr.style.display = "block";
                    resultText.textContent = "You reached the magical castle!";
                } else {
                    resultImg.src = "images/mansion.png";
                    qr.style.display = "none";
                    resultText.textContent = "Oh no! You ended up in the haunted mansion!";
                }

                // Reverse scale to normal
                setTimeout(()=>{
                    resultImg.style.transition = "transform 1.5s ease";
                    resultImg.style.transform = 'translateX(-50%) scale(1)';
                    // Fade in text/QR after castle/mansion reveal
                    setTimeout(()=>{
                        resultText.style.opacity = 1;
                    },500);
                },50);

            }, 5500); // 2s pulse + 1.5s drift + 2s zoom/fade

        });
    });
});
</script>
</body>
</html>
