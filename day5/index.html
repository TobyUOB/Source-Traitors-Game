<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 5 – Dice Roll</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ================= BASE ================= */
body {
    margin:0;
    background:#0a0805;
    color:white;
    font-family: Arial, sans-serif;
    overflow:hidden;
    position:relative;
}

/* ================= TORCHLIGHT ================= */
body::before,
body::after {
    content:"";
    position:fixed;
    inset:-30%;
    pointer-events:none;
    z-index:0;
}
body::before {
    background: radial-gradient(circle at 30% 40%, rgba(255,190,110,0.35), transparent 55%);
    animation: torchA 5.5s infinite alternate ease-in-out;
}
body::after {
    background: radial-gradient(circle at 70% 65%, rgba(255,150,70,0.30), transparent 60%);
    animation: torchB 7s infinite alternate ease-in-out;
}
@keyframes torchA { from{transform:translate(-4%,-3%);opacity:0.6;} to{transform:translate(4%,3%);opacity:1;} }
@keyframes torchB { from{transform:translate(3%,-3%);opacity:0.5;} to{transform:translate(-3%,4%);opacity:0.9;} }

/* ================= GRAIN ================= */
body.grain::before {
    background-image:url('images/grain.png');
    background-size:cover;
    mix-blend-mode:overlay;
    opacity:0.05;
    animation: grainMove 12s linear infinite;
}
@keyframes grainMove {
    0%{transform:translate(0,0);}
    25%{transform:translate(-2%,1%);}
    50%{transform:translate(1%,-1%);}
    75%{transform:translate(-1%,2%);}
    100%{transform:translate(0,0);}
}

/* ================= SYMBOLS ================= */
.symbol-overlay {
    position:fixed;
    inset:0;
    background:url('images/symbols.png') repeat;
    background-size:180px 180px;
    opacity:0.1;
    pointer-events:none;
    z-index:1;
    animation:symbolsGlow 8s infinite alternate ease-in-out;
}
@keyframes symbolsGlow {
    0%{opacity:0.08;}
    50%{opacity:0.15;}
    100%{opacity:0.08;}
}

/* ================= EMBERS ================= */
#embers {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
}
.ember {
    position:absolute;
    width:4px;
    height:4px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 10px orange;
    animation: emberRise 6s linear infinite;
}
@keyframes emberRise {
    from{transform:translateY(100vh);opacity:0;}
    30%{opacity:1;}
    100%{transform:translateY(-50px) translateX(-40px);opacity:0;}
}

/* ================= CONTENT ================= */
#container {
    position:relative;
    z-index:10;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
}

/* LOGO */
#logo {
    width:100px;
    max-width:90%;
    margin-bottom:6px;
}

/* HEADING */
#heading {
    font-family:'Cinzel', serif;
    font-size:2.4em;
    font-weight:800;
    margin-bottom:6px;
    animation:flicker 1.2s infinite alternate;
    text-align:center;
}
@keyframes flicker {
    0%{opacity:1;}
    60%{opacity:0.45;}
    100%{opacity:1;}
}

/* ================= DICE ================= */
#dice-container {
    position:relative;
    width:260px;
    max-width:90%;
    display:flex;
    justify-content:center;
    align-items:center;
}

#dice {
    width:100%;
    height:auto;
    cursor:pointer;
    display:block;
}

/* Glow before roll */
#dice.glow {
    animation:diceGlow 2s infinite alternate;
    filter:
        drop-shadow(0 0 10px rgba(255,200,0,0.7))
        drop-shadow(0 0 20px rgba(255,200,0,0.4));
}
@keyframes diceGlow {
    0%{filter:drop-shadow(0 0 8px rgba(255,200,0,0.6));}
    50%{filter:drop-shadow(0 0 20px rgba(255,220,0,0.9));}
    100%{filter:drop-shadow(0 0 8px rgba(255,200,0,0.6));}
}

/* Roll animation */
#dice.rolling {
    animation:diceThrow 1s ease-in-out forwards;
}
@keyframes diceThrow {
    0%{transform:translateY(0) rotate(0deg) scale(1); filter:blur(0);}
    15%{transform:translateY(-120px) rotate(360deg) scale(1.15); filter:blur(4px);}
    40%{transform:translateY(-70px) rotate(720deg) scale(1.1); filter:blur(3px);}
    70%{transform:translateY(-30px) rotate(1080deg) scale(1.05); filter:blur(1.5px);}
    85%{transform:translateY(-8px) rotate(1260deg) scale(1);}
    100%{transform:translateY(0) rotate(1440deg) scale(1); filter:blur(0);}
}

/* ================= NUMBER ================= */
#dice-number {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:'Cinzel', serif;
    font-size:2.2em;
    font-weight:800;
    color:rgba(255,255,255,0.9);
    text-shadow:
        0 0 6px rgba(255,255,255,0.7),
        0 0 12px rgba(255,255,255,0.5);
    opacity:0;
    pointer-events:none;
    z-index:999;
    transition:opacity 0.4s ease;
}

/* QR */
#qr {
    margin-top:10px;
    width:200px;
    max-width:100%;
    display:none;
}

/* MOBILE */
@media(max-width:700px){
    #dice-container{width:180px;}
    #dice-number{font-size:1.4em;}
}
</style>
</head>

<body class="grain">

<div class="symbol-overlay"></div>

<div id="embers">
    <div class="ember" style="left:10%; animation-delay:0s;"></div>
    <div class="ember" style="left:25%; animation-delay:1s;"></div>
    <div class="ember" style="left:40%; animation-delay:2s;"></div>
    <div class="ember" style="left:60%; animation-delay:0.5s;"></div>
    <div class="ember" style="left:75%; animation-delay:1.5s;"></div>
</div>

<div id="container">
    <img id="logo" src="images/logo.png" alt="Logo">
    <div id="heading">One last roll of the dice...</div>

    <div id="dice-container">
        <img id="dice" src="images/dice.png" alt="Dice">
        <div id="dice-number"></div>
    </div>

    <img id="qr" alt="QR Code">

    <audio id="fire" loop>
        <source src="sounds/fire-crackle.mp3" type="audio/mpeg">
    </audio>
</div>

<script src="script.js"></script>
</body>
</html>
